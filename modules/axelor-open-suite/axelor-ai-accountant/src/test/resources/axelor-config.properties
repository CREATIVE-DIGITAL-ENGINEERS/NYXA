# Test-only configuration for the DB-backed transcript test. Never shipped.
application.name = AI Accountant Tests
application.description = AI Accountant Tests
application.mode = dev

# HSQLDB in memory. `create` builds the schema from the generated entities on start, which is the
# whole point: the unique constraints the test relies on are the ones the domain XML declares.
db.test.driver = org.hsqldb.jdbc.JDBCDriver
db.test.ddl = create
db.test.url = jdbc:hsqldb:mem:aiaccountant
db.test.user = sa
db.test.password =

# Nothing scheduled in a unit test.
quartz.enable = false
