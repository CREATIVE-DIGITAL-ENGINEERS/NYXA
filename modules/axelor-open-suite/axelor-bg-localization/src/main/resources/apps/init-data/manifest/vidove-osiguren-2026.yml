# Манифест на ВТОРАТА ВЪЛНА видове осигурен — доставеното и това, което остава с адрес.
#
# ЗАЩО СЪЩЕСТВУВА. Втората вълна дава ставки на СЕДЕМ кода, които без нея имат профил в
# bg_insured_type.csv и НУЛА реда в bg_insurance_contribution.csv. Част от въпросите обаче НЕ се
# затварят с число от таблицата и точно те са тук: код 17 се затвори по НОРМАТА, след като по
# таблицата остана неразличим, а две са РАЗМИНАВАНИЯ между два източника, всеки валиден на своето
# място. Плюс една находка за празен период и групата на самоосигуряващите се.
#
# ⚠️ ТОЗИ ФАЙЛ НЕ ОПИСВА ДАННИ, КОИТО ЛИПСВАТ ИЗЦЯЛО — за това е sol-2026.yml. Тук стоят въпроси,
# на които таблицата на НАП отговаря НЕЕДНОЗНАЧНО или отговаря РАЗЛИЧНО от втори валиден източник.

издание:   Видове осигурен, втора вълна (група „през фиша“ + балет), 2026 г.
източник:  >-
  Приложение № 1 към писмо ВК-30-10237/12.08.2026 г. на НАП — „Таблица за размерите на
  осигурителните вноски за ДОО, ДЗПО, ЗО и УчПФ по осигурени лица и разпределение между
  осигурител/осигуряващ и осигурено лице за 2026 г.“
съставен:  2026-08-27
състояние: доставени 7 кода (06, 17, 42, 82, 83, 95, 97) · 2 обявени разминавания

# ── ДОСТАВЕНОТО, С РАЗДЕЛА, ОТ КОЙТО ИДВА ВСЯКО ЧИСЛО ───────────────────────────────────────────
доставени:
  "06": {раздел: "6.1 / 6.2", фонд: PENSION_ART69, ставки: "60,8 / 55,8", платец: държавата}
  "83": {раздел: "7.3",       фонд: PENSION_ART69, ставки: "60,8 / 55,8", платец: държавата}
  "17": {раздел: "7.3",       фонд: PENSION_ART69, ставки: "60,8 / 55,8", платец: държавата}
  "97": {раздел: "16.1 / 16.2", фондове: "Пенсии, УПФ, Здравно, ТЗПБ 0,90 фиксирана", платец: сплит}
  "42": {раздел: "19.1 + заб. 9", фондове: "пълен набор", платец: държавният бюджет}
  "82": {раздел: "шапката на 1", фондове: "като код 01 без ГВРС", платец: сплит}
  "95": {раздел: "8.1 / 8.2",  фондове: "като код 01", платец: "сплит, +3пп само при осигурителя"}

# ── КОД 17 · ЛИПСА, ЗАТВОРЕНА ПО ПРАВНО ОСНОВАНИЕ (не по таблицата) ────────────────────────────
код_17:
  наименование: Служители на Държавна агенция „Разузнаване“ и Служба „Военно разузнаване“ на МО
  състояние: ДОСТАВЕН — профилът е дословно този на 06 и 83
  как_се_затвори: >-
    ⚠️ НЕ от таблицата, и това си струва да се помни. Раздел 7 дава ТРИ профила — 7.1 сплит
    13,72/10,58, 7.2 изцяло осигурител 24,3 и 7.3 изцяло осигурител 65,3 — и не закача код към нито
    един. По самата таблица код 17 остава неразличим, защото 7.1 и 7.2 имат ЕДИН И СЪЩ общ размер
    (24,3) и се различават само по платеца.

    Затваря го НОРМАТА, не таблицата: КСО чл. 4 ал. 1 т. 4 назовава ИЗРИЧНО „държавните служители
    по Закона за Държавна агенция «Разузнаване»“. Оттам лицето е сред тези по чл. 69 (ранна
    пенсия) — същото основание, по което там стоят военнослужещите (код 06) и код 83, — и
    следователно профилът е техният: фонд „Пенсии за лицата по чл. 69“ 60,8 / 55,8, плюс УПФ, ОЗМ,
    безработица и здравно, всичко изцяло за сметка на държавата. Редовете на 24,3 в разд. 7 са за
    другите категории служители в същите ведомства.
  праг: >-
    bgFloorType = MIN_WAGE, зададен в предходния комит и НЕПРОМЕНЕН тук. Той беше определим и преди
    ставките: и трите реда на разд. 7 пишат „не по-малко от минималната месечна работна заплата“.
  остава_отворено: >-
    Становище на НАП кой код се попълва за коя от трите групи на разд. 7 е формалност — основанието
    по чл. 4 ал. 1 т. 4 е ясно. Ако НАП някога каже друг профил, корекцията е малка: шест реда
    (IC-305-2026 … IC-310-2026) и нищо друго, защото прагът не зависи от избора.

# ── РАЗМИНАВАНЕ 1 · КОД 42: ВЪПРОСНИКЪТ КАЗА „ЛИЦЕТО“, ТАБЛИЦАТА КАЗВА „ДЪРЖАВНИЯТ БЮДЖЕТ" ─────
разминаване_платец_42:
  източник_А: попълненият въпросник — колона „Платец“ = „лице“
  източник_Б: >-
    НАП Приложение № 1, заб. 9, дословно: „Дължимите социални и здравноосигурителни вноски за
    учениците, включени в обучение чрез работа (дуална система на обучение), са изцяло за сметка на
    държавния бюджет.“ Раздел 19.1 оставя цялата колона „за сметка на осигуреното лице“ ПРАЗНА и
    слага звездичка на всяко число при осигурителя — звездичката сочи именно заб. 9.
  прието: източник Б
  защо: >-
    Заб. 9 е дословна и е част от ОФИЦИАЛНАТА таблица, обявена за източник на ставките. Колоната в
    въпросника е попълнена накратко и на същия ред е сгрешила и друго („мин 620,20“ при код 97,
    където таблицата иска МОД по икономическа дейност). Цената на грешката е несиметрична: удръжка
    от ученик, която не му се полага, изглежда като нормален фиш.
  ⚠️_за_потвърждение: >-
    Това е ПРОМЯНА спрямо подаденото задание и трябва да се потвърди от счетоводител — не защото числото
    е спорно, а защото източник А е негов.

# ── РАЗМИНАВАНЕ 2 · КОД 42: ЕДИН ФЛАГ, ДВА ГОСПОДАРЯ ───────────────────────────────────────────
разминаване_праг_42:
  наблюдение: >-
    Наредба Н-13, Приложение № 1, заб. 1 изброява код 42 сред 18-те кода, за които СЕ ПОПЪЛВАТ т.
    12.1, 12.2 и 12.3 на Декларация обр. 1 — тоест bgAppliesMod = true е ВЯРНО и е заковано в
    BgD1FlagsAgainstNaredbaTest срещу самата наредба.

    Същевременно раздел 19.1 на таблицата на НАП определя долния праг като „не по-малко от
    минималната месечна работна заплата (620,20 евро)“, а НЕ като минимален осигурителен доход по
    икономически дейности.
  проблемът: >-
    ⚠️ bgAppliesMod днес отговаря на ДВА различни въпроса наведнъж: „попълват ли се т. 12.1-12.3 в
    Д1“ (Наредба Н-13) и „кой праг важи“ (BgInsurableIncomeService чете bgFloorType САМО когато
    bgAppliesMod = false). За код 42 двата отговора се разминават — наредбата казва „да“, таблицата
    казва „прагът е МРЗ“ — и моделът няма как да носи двете едновременно.
  какво_НЕ_е_направено_и_защо: >-
    Флагът НЕ е сменен. Смяната би направила Д1 невярна и би счупила теста, който сверява флаговете
    срещу наредбата — тоест би заменила праг-грешка с декларация-грешка. Прагът остава на днешното
    поведение и разминаването стои тук.
  какво_би_го_решило: >-
    Разделяне на двата въпроса: bgAppliesMod остава Д1 флаг, а долният праг получава СОБСТВЕНА
    стойност (например bgFloorType = MIN_WAGE, четена независимо от bgAppliesMod). Това е промяна в
    BgInsurableIncomeService#floorCodeOf и засяга и заварени кодове — отделен клон.

# ── НАХОДКА · ПРАЗЕН ПЕРИОД ПРИ ОБЕЗЩЕТЕНИЕТО ПО ЧЛ. 106 АЛ. 2 ЗДСЛ ────────────────────────────
nahodka_h1_2026:
  наблюдение: >-
    Редовете за код 27 с основание comp_zdsl_106_2 покриват 01.08.2026 – 31.12.2026 (80/20) и
    01.01.2027 нататък (60/40). За 01.01.2026 – 31.07.2026 НЯМА нито един ред.
  следствие: >-
    Обезщетение по чл. 106 ал. 2 ЗДСл с дата в първото полугодие на 2026 г. пада на
    NO_CONTRIBUTIONS_FOUND. Същият празен период има и код 05 (държавни служители): IC-024…IC-030
    започват на 01.08.2026, а по-ранен ред няма.
  състояние: >-
    НЕ Е ПОПРАВЕНО в този клон — код 05 е ядро и е извън обхвата, а поправка само на 27 би оставила
    двата кода разминати по период. Ставката за H1 2026 иска сверен член (съотношението преди
    новата чл. 6 ал. 5а), какъвто в този клон не е установен.

