# Манифест на речника с редове на фиша — какво трябва да има в базата след зареждане.
#
# ЗАЩО СЪЩЕСТВУВА. „Импортирано успешно“ и „не направи нищо успешно“ изглеждат еднакво: App Install
# връща status: 0 и в двата случая. Затова броенето е тук, а не в главата на този, който гледа
# лога.
#
# ⚠️ ПРОВЕРЯВА СЕ СРЕЩУ БАЗАТА, НЕ СРЕЩУ CSV-ТАТА. App Install е upsert по importId: не умее да
# ИЗТРИЕ ред (махнат от файла, той остава жив в базата) и не умее да ИЗЧИСТИ стойност (празна клетка
# не става NULL). И двете са мълчаливи — файлът твърди едно, базата пази друго.
#
# Проверява се от BgPaySlipLineTypeManifestTest след restore-all и App Install. Съответствието едно
# към едно с двата речника (фондове, обезщетения) се пази отделно — BgPaySlipLineTypeCatalogueTest.

издание:    Речник на редовете на фиша, начален набор
източник:   BLOCK_F_PAYROLL_SPEC.md § 4.2 и § 12 (WS-1, стъпка 2)
съставен:   2026-08-14

# ── ГРАНИЦАТА, КОЯТО ТОЗИ РЕЧНИК ПАЗИ ─────────────────────────────────────────────────────────
# Тук влиза само това, което се ОТПЕЧАТВА на фиша със сума. Часовете, дните, количествата и
# ставките са ВХОД и живеят другаде. Речникът на Microinvest смесва двете в едно
# пространство от имена и оттам не се знае кое от него изобщо стига до фиша — това не се повтаря.

очаквано:

  # ⚠️ ЧЛ. 106 ЗДСл НОСИ ЧЕТИРИ РЕДА: освен ал. 2 и ал. 3, ал. 3а и ал. 4 (925, 926, 927) — трите
  # режима са различни и всеки иска свое третиране. Виж по_група и огледални_на_каталози отдолу.
  #
  # ⚠️ ОБЕЗЩЕТЕНИЕТО ПО ЧЛ. 217 КТ (928) — трудоустрояване, при което работодателят не е предоставил
  # подходяща работа. ⚠️ ЧЛ. 222 АЛ. 4 КТ НЕ добавя ред и не бива да добавя: ал. 4 казва „Алинея 3
  # се прилага и когато…“, тоест е второ ОСНОВАНИЕ на същото право, не второ право. Тя живее като
  # тригер на comp_kt_222_3 (перо 902).
  #
  # ⚠️ ГОДИШНОТО ИЗРАВНЯВАНЕ ПО ЧЛ. 49 (710) — втори и последен ред в групата TAX. Той НЕ е втори
  # данък, а разликата между вече определения годишен данък по чл. 49 ал. 1 и авансово удържания по
  # чл. 42: удържа се по ал. 5 или се възстановява по ал. 6.
  #
  # ⚠️ ВЪЗНАГРАЖДЕНИЕТО ЗА ПЛАТЕН ОТПУСК ПО ЧЛ. 177 КТ (165). То е
  # ПЪРВОТО перо в групата, което не ДОБАВЯ пари, а ги ПРЕМЕСТВА: дните платен отпуск се изваждат от
  # перата с постоянен характер за същия месец и се плащат единствено през него. При непроменен
  # състав на възнаграждението сборът на фиша е същият — виж note-а на реда и BgArt177LeaveService.
  редове_общо: 108
  най_малък_номер: 100
  # ⚠️ Горният край е последният номер на групата COMPENSATIONS: социалните разходи са в 200–271 и
  # 630, тоест вътре в диапазона, а новите обезщетения продължават редицата на COMPENSATIONS.
  най_голям_номер: 928

  # Уникалността е на ниво схема (unique на code и на number), но се брои и тук: колона с unique
  # ограничение, което някой е махнал при рефакторинг, мълчи по същия начин като липсващ импорт.
  # ⚠️ Трите брояча (с редове_общо) се движат ЗАЕДНО само докато нито един ред не е дубликат — разминаят
  # ли се, това е находката, а не разсинхронът.
  уникални_кодове: 108
  уникални_номера: 108

  # ⚠️ DEDUCTIONS: перото на ИЗДРЪЖКАТА ЗА МИНАЛО ВРЕМЕ (831) е отделно от 830. Не е
  # козметично раздвояване на 830, а разграничение, което прави САМАТА ал. 4 на ГПК чл. 446:
  # присъдената текуща издръжка „се удържа изцяло“, а „задълженията за издръжка за минало време“ са
  # при „другите задължения“ по ал. 1 — върху ОСТАТЪКА, с таван и с пода от една МРЗ по ал. 3. Слети
  # в едно перо, просрочената излиза цяла и сваля лицето ПОД МРЗ: при нето 1500, текуща 200,
  # просрочена 700 и МРЗ 620,20 слятото оставя 600, разграниченото — 650.
  #
  # ⚠️ SALARY_ADDITIONS: тук е перото на болничния за сметка на ОСИГУРИТЕЛЯ
  # (195, чл. 40 ал. 5 КСО). Групата е избрана заради АРИТМЕТИКАТА, не по сходство с 3xx: BgPaySlipResolver
  # брои брутото и разхода за работодателя само от 1xx и 9xx, а тази сума е точно това — разход на
  # работодателя и осигурителен доход на лицето. Ред от 3xx би паднал извън двете.
  #
  # ⚠️ PAYMENTS: към аванса (600) и частичното плащане (610) е и перото на
  # НЕТНАТА ДЕЛТА по ретро-корекция (620). Групата е избрана заради аритметиката, не по сходство:
  # BgPaySlipResolver брои брутото само от 1xx и 9xx, а нетото — от всичко начислено извън 5xx, тоест
  # 6xx ред мени НЕТОТО и не мени брутото, осигурителния доход и разхода за работодателя. Точно това
  # трябва да прави разликата от корекция: майската ведомост се променя, майските Д1/Д6 — не.
  #
  # ⚠️ SOCIAL_EXPENSES: групата НЕ Е ПРАЗНА. Четиринайсет реда
  # са ПОД КАПАЧКА (по два на позиция: „в рамките“ и „превишение“, сочещи към обща BgSocialExpenseCap)
  # и единайсет са БУЛЕВИ (облекло, безплатна храна по КТ чл. 285, задължителни застраховки, помощ за
  # лечение, транспорт в три хипотези, двойката „в натура“/„не в натура“). Разбивката е в
  # социални_разходи отдолу.
  #
  # ⚠️ PAYMENTS: и КОНТРА-ПЕРОТО НА НАТУРАТА (630). То не е ново плащане, а
  # корекция на аритметика: netTotal брои всяко начисление извън 5xx, тоест перо от 2xx със знак
  # CREDIT ВЛИЗА В НЕТОТО. За социален разход в ПАРИ това е вярно — той е в плика. За натурата не е:
  # ваучерът не е нито стотинка от нетото за получаване, а перото му трябва да се вижда и да влиза в
  # осигурителния доход и в данъчната основа. 630 (DEBIT, 6xx) го изважда от нетото и НЕ пипа нито
  # един от трите агрегата на декларацията — insuranceIncomeBase и taxBase броят начисления само със
  # знак CREDIT, а taxBase вади единствено DEBIT от 5xx.
  #
  # ⚠️ И ТОЧНО ЗАТОВА BgPaySlipResolver НЕ СЕ ПИПА. Алтернативата — цялата група 2xx да се изключи
  # от нетото, както е изключена 5xx CREDIT — би изключила и социалните разходи В ПАРИ,
  # които СА в плика. Знакът на едно перо казва точно кое е предадено в натура.
  по_група:
    # ⚠️ Перото по чл. 177 (165) е в 1xx, а НЕ в SICK_AND_LEAVE, по същия
    # довод като болничния от осигурителя (195): BgPaySlipResolver брои брутото и разхода за
    # работодателя само от 1xx и 9xx, а възнаграждението за платен отпуск Е брутна работна заплата
    # (НСОРЗ чл. 16 ал. 2 т. 7) и Е осигурителен доход.
    SALARY_ADDITIONS: 19
    CONTRIBUTIONS: 20
    PAYMENTS: 4
    # ⚠️ Двата реда на групата се четат от РАЗЛИЧНИ места и това е самото
    # правило, а не подредба: BgD6Aggregator мете и двата в т. 16 на Д6 (указанието иска „чл. 41а,
    # чл. 42 И ЧЛ. 49 АЛ. 5“), а BgPaySlipResolver#taxFromLines брои САМО 700 — той сверява
    # МЕСЕЧНИЯ данък срещу заглавната сума и годишното изравняване няма какво да търси там.
    TAX: 2
    DEDUCTIONS: 9
    COMPENSATIONS: 29
    SOCIAL_EXPENSES: 25
    # ⚠️ ЕДНА ГРУПА ОСТАВА ДЕКЛАРИРАНА В СЕЛЕКЦИЯТА И СЪЗНАТЕЛНО ПРАЗНА.
    SICK_AND_LEAVE: 0

  съзнателно_празни:
    SICK_AND_LEAVE: >-
      Изчислението на болничните и отпуските е отделен workstream. Празната група, която знае защо е
      празна, е по-честна от заредената наполовина.

      ⚠️ И ОСТАВА ПРАЗНА СЛЕД 21.08.2026, макар болничният за сметка на осигурителя вече да се смята.
      Перото му (195) влезе в 1xx, а не тук, защото BgPaySlipResolver брои брутото и разхода за
      работодателя само от 1xx и 9xx. Групата чака онова, което наистина е нейно: дните и сумите,
      които НОИ плаща (Приложение 9), и перата на отпуските.

  # ── ГРУПАТА НА СОЦИАЛНИТЕ РАЗХОДИ (2xx) ─────────────────────────────────────────────────────────
  # Записана отделно, защото числата ѝ не са едно число: групата има ДВЕ различни устройства и
  # смесени, те правят разминаването непредставимо.
  социални_разходи:
    общо: 25
    под_капачка: 14
    булеви: 11
    # По ДВЕ пера на позиция, сочещи към ОБЩАТА си капачка. Числото е 2 × брой позиции, не 2 × брой
    # капачки: DDO_HEALTH_LIFE има ТРИ позиции (доброволно пенсионно, доброволно здравно, „Живот“),
    # ONE_OFF_AID също три (раждане, брак, смърт), FOOD_VOUCHERS — една.
    позиции_по_капачка:
      DDO_HEALTH_LIFE: 3
      FOOD_VOUCHERS: 1
      ONE_OFF_AID: 3
    с_попълнена_капачка: 14
    защо_две_пера: >-
      Флаговете bgIsTaxable и bgIsInsuranceIncome са БУЛЕВИ ПРЕДИКАТИ в сборовете на
      BgPaySlipResolver — ред влиза ЦЯЛ или не влиза. Едно перо със сума над капачката щеше да е или
      цялото облагаемо, или цялото необлагаемо, тоест грешно и в двете посоки. Разделянето прави
      BgSocialExpenseCapResolver, а капачката е ОБЩА за позициите, сочещи към същия ред.
    целият_размер_при_неусловие: >-
      ЗКПО чл. 213 ал. 3 и чл. 214 ал. 3: при паднало условие данъчната основа е ЦЕЛИЯТ размер на
      начислените разходи за месеца, не превишението. Затова полето на фиша се казва „месечна ЗКПО
      основа“, а НЕ „превишение“ — в болния случай „превишение“ е невярно име, а не неточно. При
      ваучер 150,00 EUR разликата е между 47,74 и 150,00 в основата, тоест между 4,77 и 15,00 данък.
    # ⚠️ ЧЕТИРИ АСИМЕТРИИ МЕЖДУ ЗДДФЛ И НЕВД, всяка ИЗМЕРЕНА срещу дословния текст на 26.08.2026 г. и
    # всяка носена от ФЛАГОВЕТЕ на конкретни редове. Броят на разминаващите се пера е тук, за да не
    # може някой да „изравни“ флаговете и да мине зелен.
    асиметрии_zddfl_nevd:
      застраховка_живот: >-
        ЗДДФЛ чл. 24 ал. 2 т. 12 обединява доброволното пенсионно, доброволното здравно и
        застраховката „Живот“ в едно число (60 лв.). НЕВД чл. 2 ал. 2 обаче изброява изчерпателно и
        в списъка му стоят само доброволното ПЕНСИОННО, доброволното ЗДРАВНО и доброволното за
        БЕЗРАБОТИЦА и професионална квалификация — „Живот“ ГО НЯМА. Следствие: перата 204 и 205
        носят bgIsInsuranceIncome = true, а 200–203 — false. Изравнени, флагът щеше да махне вноски,
        които се дължат, и разликата не се вижда на нито едно друго число на фиша.
      pomosht_pri_brak: >-
        ЗДДФЛ чл. 24 ал. 2 т. 11 дава ОБЩА необлагаема сума за раждане, БРАК и смърт. НЕВД чл. 2
        ал. 2 изключва от осигурителния доход помощите „за лекарства, при продължително боледуване,
        за раждане, при смърт на член от семейството или при други СЛУЧАЙНО НАСТЪПИЛИ събития“ —
        сключването на граждански брак ГО НЯМА и не е случайно настъпило събитие. Следствие: перата
        222 и 223 носят bgIsInsuranceIncome = true, а 220/221 и 224/225 — false.
      v_natura_ne_maha_osigurovkite: >-
        Най-често четената грешно норма в тази група. „В натура“ маха ДАНЪКА на лицето (ЗДДФЛ чл. 24
        ал. 2 т. 9), но НЕ маха осигуровките: НЕВД чл. 2 ал. 1 дължи вноски върху социалните разходи,
        изплатени пряко, постоянно или периодично „В ПАРИ ИЛИ В НАТУРА“ — натурата е ИЗРИЧНО вътре.
        Изключения са само изброените в чл. 2 ал. 2 и в чл. 1 ал. 8. Следствие: перо 270 носи
        bgIsTaxable = false И bgIsInsuranceIncome = true — двата флага се разминават нарочно.
      protokolno_obleklo: >-
        НЕВД чл. 1 ал. 8 т. 4 изброява ЧЕТИРИ вида облекло — работно, униформено, ПРОТОКОЛНО и
        представително — а ЗДДФЛ чл. 24 ал. 2 т. 3 само три. Следствие: ред за протоколно облекло НЕ
        се засява. Той би бил извън осигурителния доход и БЕЗ изрично изключване от облагаемия, тоест
        всяка стойност на bgIsTaxable щеше да е догадка.
    # Двата реда, за които праг НЯМА, а целият размер влиза в месечната ЗКПО основа.
    с_вдигнат_bgIsCompanyExpenseTaxed: 2
    кодове_с_вдигнат_bgIsCompanyExpenseTaxed:
      [pl_soc_transport_lek_avtomobil, pl_soc_v_natura_oblozhen]
    # ⚠️ КОЕТО ВСЕ ОЩЕ ЛИПСВА. Групата не е празна, но записаните ПРОПУСКИ не са запълнени и не бива
    # да изчезнат заедно с празнотата ѝ.
    все_още_липсва:
      chl_19_al_2: >-
        ПЕРОТО ЗА ЧЛ. 19 АЛ. 2 ЗДДФЛ — второто от ДВЕТЕ месечни облекчения по чл. 42 ал. 3 (първото,
        чл. 18 ал. 2, вече има параметър DISABILITY_RELIEF_MONTHLY). Няма нито перо, нито параметър,
        нито поле в BgPayrollInput, и трите са записани нарочно, за да не се добави едното без другите
        две.

        ⚠️ И ВНИМАВАЙ ЗАЩО ТОЧНО ТУК Е ЛЕСНО ДА СЕ СБЪРКА. Едни и същи три доброволни осигуровки —
        допълнително доброволно осигуряване, доброволно здравно осигуряване и застраховка „Живот“ — се
        третират по ТРИ РАЗЛИЧНИ начина според това ЧИЯ Е ВНОСКАТА: необлагаеми до 30,68 EUR когато са
        ЗА СМЕТКА НА РАБОТОДАТЕЛЯ (ЗДДФЛ чл. 24 ал. 2 т. 12 — това са перата 200–205 тук), и месечно
        облекчение до 10 на сто когато са ЛИЧНИ вноски (чл. 19 ал. 2). Третото НЕ е социален разход и
        НЕ бива да влезе в тази група по аналогия: то е ОБЛЕКЧЕНИЕ, тоест намалява данъчната основа
        като чл. 18 ал. 2, а не е разход на работодателя.
      protokolno_obleklo: >-
        РЕД ЗА ПРОТОКОЛНО ОБЛЕКЛО. НЕВД чл. 1 ал. 8 т. 4 го изброява наред с работното, униформеното
        и представителното, а ЗДДФЛ чл. 24 ал. 2 т. 3 изброява само трите. Тоест то е извън
        осигурителния доход и НЕ е сред изрично изключените от облагаемия — всяка стойност на
        bgIsTaxable би била догадка. Чака отговор, не комит.
      sbko: >-
        „СБКО процент“ и „СБКО сума“ от речника на Microinvest. Те НЕ са пера и не са норма: това е
        начин на РАЗПРЕДЕЛЯНЕ на средствата за социално-битово и културно обслужване по КТ чл. 293,
        тоест ВХОД. Придобивката, която излиза от него, вече има пера — 240, 250, 270 и 271 според
        квалификацията си.
    извън_обхвата: >-
      Самият ГОДИШЕН фирмен данък — 10 на сто върху сумата от месечните основи по ЗКПО чл. 213 ал. 1
      и чл. 214 ал. 1 — НЕ се смята никъде в този модул, както и декларирането и плащането му, нито
      натрупването през 12 месеца × N лица. Това е ОТДЕЛЕН отчет и решение за обхват. Тук стои
      тухлата, от която такъв отчет би се сглобил: месечната пер-лице основа, записана на всеки фиш.
      ⚠️ И ЗАТОВА тя се записва СЕГА: ал. 3 на двете норми зависи от състояние, което съществува само
      в онзи месец (имало ли е публични задължения към края му, бил ли е операторът лицензиран, била
      ли е заплатата под средната за предходните три). През декември този вход вече не е наличен.

  # ── ПЕРОТО НА РЕТРО-КОРЕКЦИЯТА (620) ────────────────────────────────────────────────────────────
  # Записано отделно, защото двата му флага НЕ са настройка, а самото правило.
  retro_delta:
    код: pl_korekcia_minal_period
    номер: 620
    група: PAYMENTS
    флагове: >-
      bgIsInsuranceIncome = false И bgIsTaxable = false. Вноските и данъкът за коригирания месец вече
      седят в КОРИГИРАЩИЯ фиш за него и оттам в коригиращата Д1/Д6 за него. Вдигнат кой да е от двата,
      същият доход се осигурява и облага ВТОРИ път — в текущия месец — и грешката изглежда точно като
      вярна сметка.
    посока: >-
      ⚠️ ЕДИНСТВЕНОТО перо, чиято посока НЕ е окончателна на типа. Обявеното CREDIT е по-честият случай
      (доплащане). Знакът и името на РЕДА се слагат от услугата по знака на делтата: при намаление или
      заличаване редът е DEBIT и се чете „Удръжка за 03/2026“.
    маркер: >-
      Редът носи bgCorrectsPeriod = коригирания период. Маркерът, а не флаговете, е онова, което
      изключва делтата от Д1/Д6 на ТЕКУЩИЯ месец и я включва в текущото нето.

  # ── ПЕРОТО НА БОЛНИЧНИЯ ЗА СМЕТКА НА ОСИГУРИТЕЛЯ (195) ──────────────────────────────────────────
  # Записано отделно по същата причина като 620: двата му флага НЕ са настройка, а самото правило.
  bolnichen_rabotodatel:
    код: pl_bolnichen_rabotodatel
    номер: 195
    група: SALARY_ADDITIONS
    флагове: >-
      bgIsInsuranceIncome = true И bgIsTaxable = false. Двата отговарят на РАЗЛИЧНИ закона и точно
      затова изглеждат противоречиви. Осигурителен доход е по чл. 40 ал. 5 КСО — вноските се дължат
      върху тази сума и тя влиза в Д1. Необлагаем е по ЗДДФЛ чл. 24 ал. 2 т. 14 във връзка с чл. 13
      ал. 1 т. 6: обезщетенията по КСО не са облагаем доход от трудово правоотношение. Свит до един
      флаг, случаят става или необложен и неосигурен, или обложен и осигурен — и двете грешни.
    непостоянен: >-
      bgIsPermanentCharacter = false. Не е допълнително трудово възнаграждение по НСОРЗ чл. 11 или
      чл. 12 и не зависи от отработеното време — то е нула точно в дните, за които се плаща. Вдигнат,
      флагът би вкарал болничния в базата за платения отпуск по КТ чл. 177 ал. 2.
    база: >-
      bgCalculationBase = DERIVED. Сумата идва от BgSickLeaveService, не от начисленията: тя стъпва на
      епизодите и на осигурителния стаж, които енджинът за начисления не познава.
    провенанс: >-
      Сверено с реален фиш от 07.2026 г. (Микроинвест) и с клиента на 21.08.2026 г. ⚠️ ДНИТЕ ЗА НОИ
      (Приложение 9, 80 или 90 на сто за първите 18 месеца) НЕ СА ТУК и не са перо: НОИ ги плаща.
      Сумата и данните за НОИ са WS-7 — тук се показват само дните.

  # ── ПЕРОТО НА ИЗДРЪЖКАТА ЗА МИНАЛО ВРЕМЕ (831) ──────────────────────────────────────────────────
  # Записано отделно по същата причина като 620 и 195: тук настройка няма — има правило.
  izdrazhka_minalo_vreme:
    код: pl_izdrazhka_minalo_vreme
    номер: 831
    група: DEDUCTIONS
    посока: DEBIT
    правило: >-
      Перото се удържа ПО АЛ. 1, ВЪРХУ ОСТАТЪКА — не цяло, както текущата издръжка (830). Дословно,
      чл. 446 ал. 4 (сверено срещу официалния ГПК, justice.government.bg, 24.08.2026): „присъдената
      сума за издръжка се удържа изцяло, а удръжките по ал. 1 за другите задължения на осъдения И ЗА
      ЗАДЪЛЖЕНИЯ ЗА ИЗДРЪЖКА ЗА МИНАЛО ВРЕМЕ се правят върху остатъка от всичките му доходи.“

      ⚠️ Оттам следва, че подът по ал. 3 (една МРЗ) важи за ТОВА перо и не важи за 830. Едно общо
      перо за двете значи едно от двете правила — тоест или просрочената минава под пода, или
      текущата се ограничава от таван, който за нея не важи.
    ред: >-
      Вътре в тавана перото се удовлетворява ПРЕДИ запора (820/821). Основание: ЗЗД чл. 136 ал. 1
      т. 5 — вземанията за издръжка са привилегировани. ⚠️ ПРОВЕНАНС: точката е от caselaw източник
      и НЕ е сверена срещу официалния ЗЗД в тази среда. Сверен е само механизмът — ГПК чл. 460
      („най-напред отделя суми за изплащане на вземанията, които се ползват с право на предпочтително
      удовлетворение“).
    клампа: >-
      Надвишеното се КЛАМПВА, не отказва — просрочената издръжка е съдебен акт, не съгласие, тоест
      се третира като запора. Клампата се СМЯТА и НАЗОВАВА, но НЕ се записва: netTotal вади всяка
      удръжка и автоматичен запис би изтрил единствената следа колко е поискано.

  постоянен_характер:
    брой: 5
    кодове: [pl_osnovna, pl_tspo, pl_nauchna_stepen, pl_postoyanen_bonus, pl_postoyanna_premia]
    основание: >-
      НСОРЗ чл. 15. Постоянни са допълнителните възнаграждения по чл. 11 и чл. 12 от наредбата
      (научна степен и трудов стаж), както и тези, които се плащат постоянно заедно с основното и
      зависят ЕДИНСТВЕНО от отработеното време. Влизат в базата за платения отпуск по КТ чл. 177
      ал. 2 и в БТВ за обезщетенията, тоест флагът не е етикет.
    спорни: >-
      Нощният труд (130) и времето на разположение (140) са заредени с НЕ. По-тясното четене е
      обратимо, а по-широкото влиза мълчаливо в две бази наведнъж. Спорът НЕ е решен в кода —
      записан е в бележките на двата реда.

  # ── В БАЗАТА ЗА ПЛАТЕН ОТПУСК — НСОРЗ ЧЛ. 17 АЛ. 1 ─────────────────────────────────────────────
  # ⚠️ ТРЕТИ ФЛАГ, ЗАЩОТО ТРИТЕ МНОЖЕСТВА СА РАЗЛИЧНИ. Постоянният характер (чл. 15) е само т. 3
  # от седемте съставки на чл. 17 ал. 1; БРЗ по чл. 16 ал. 2 е строго по-широк (той включва и
  # нощния, и извънредния, и самото възнаграждение за платен отпуск). База, четена само през
  # bgIsPermanentCharacter, губи престоя — месец с престой дава занижен отпуск.
  в_базата_по_чл_17:
    брой: 7
    кодове: >-
      pl_osnovna (т. 1), pl_rezultati (т. 2), pl_tspo, pl_nauchna_stepen, pl_postoyanen_bonus,
      pl_postoyanna_premia (т. 3), pl_prestoi_267 (т. 6)
    инвариант: >-
      bgIsPermanentCharacter = true ⟹ bgIsArt17Base = true. Постоянното Е в базата по т. 3;
      обратното не важи — престоят (т. 6) и резултатите (т. 2) са в базата, без да са постоянни.
      Налага се от BgPaySlipLineTypeSeedMappingTest, не от паметта на следващия редактор.
    ⚠️_обърнато_решение: >-
      pl_rezultati (190) беше зареден с НЕ и това беше ГРЕШКА в четенето, поправена в същия клон.
      Бележката на реда отрича ПОСТОЯННИЯ ХАРАКТЕР („зависи от резултат, не единствено от
      отработеното време“) — тоест тя отговаря на т. 3, а не на т. 2. Т. 2 иска нещо друго:
      „възнаграждението НАД ОСНОВНАТА работна заплата, определено според прилаганите системи за
      заплащане на труда“. Отричането на едната точка беше прочетено като отричане на другата.
      ⚠️ Дискреционното перо е 185 (pl_ednokraten_bonus) и то си остава ВЪН — бележката му го
      казва изрично. Двете пера не се бъркат.
    ⚠️_за_потвърждение: >-
      За pl_rezultati (190) остава ЕДИН въпрос към ТРЗ: прилага ли клиентът ФОРМАЛНА
      резултатна система за заплащане. По нормата това е т. 2; ако при клиента е чиста дискреция
      без система, редът флипва на false — една клетка, без промяна в кода.
    празни_точки: >-
      Т. 4 (чл. 259 — вътрешно заместване), т. 5 (чл. 266 ал. 1) и т. 7 (чл. 268 ал. 2 и 3) нямат
      перо в речника днес. Колоната ги чака: появи ли се такова перо, то влиза в базата по
      ОБЯВЯВАНЕ, а не защото някой си е спомнил.
    ⚠️_чл_17_ал_2_не_е_реализирана: >-
      Ал. 2 иска в базата за чл. 177 да влезе и „съответната ПРОПОРЦИОНАЛНА ЧАСТ от допълнителните
      периодични или годишни възнаграждения, изплатени СЛЕД ползването на платения отпуск, като за
      целта се ПРЕИЗЧИСЛЯВАТ изплатените възнаграждения за платен отпуск“. Тоест изплатен през
      декември годишен бонус мени отпуска, ПЛАТЕН през септември — със задна дата. Днес това няма
      нито носител, нито изчисление никъде в модула. Засяга 190 (pl_rezultati) и 186
      (pl_godishno_vazn). Колоната bgIsArt17Base НЕ го решава: тя казва КОЕ перо е в базата, а ал. 2
      е за КОГА и за преизчисляване назад. Обявено, за да не се сметне за уредено; въпрос към
      счетоводителя дали клиентът изобщо изплаща такива възнаграждения след отпуск.

  # ⚠️ ОТБЕЛЯЗАН ДЕФЕКТ — контролерът срещу услугата.
  # BgPaySlipService#lineFrom копира bgFormsGrossWage от речника, но
  # BgPaySlipController#lineFromType — екранният път при ръчно добавяне на перо — връща само ШЕСТ
  # стойности и НЕ връща bgFormsGrossWage. Тоест перо, добавено от формата, се записва с false и
  # пада от т. 29 на Декларация обр. 1. Засяга седемте ръчни пера в 1xx, включително 190 и 170.
  # BgGrossWageFlagTest покрива услугата; екранният път е непокрит. Отделна поправка.
  ⚠️_екранният_път_губи_bgFormsGrossWage: "BgPaySlipController#lineFromType — виж коментара горе"

  # Групите 5xx и 9xx са ГЕНЕРИРАНИ от готовите речници. Числата тук са огледални на техните:
  # разминаване значи, че някой е добавил фонд или вид обезщетение, без да мине оттук.
  огледални_на_каталози:
    CONTRIBUTIONS: "10 фонда × 2 платеца = 20"
    COMPENSATIONS: "29 вида обезщетения = 29"

  # Всеки ред от 5xx и 9xx сочи към речника си. Липсващ FK значи ред, който няма откъде да вземе
  # сума, тоест ще се отпечата празен.
  с_попълнен_фонд: 20
  с_попълнен_вид_обезщетение: 29
