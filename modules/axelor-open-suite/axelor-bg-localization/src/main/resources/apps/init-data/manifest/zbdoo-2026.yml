# Манифест на изданието — какво този закон изисква да е заредено и с какви дати.
#
# ЗАЩО СЪЩЕСТВУВА. Един клас грешки е лесен за повтаряне: зарежда се ЕДНА таблица, а законът
# иска ДВЕ, защото годината има две осигурителни половини. Таблица с един отворен период от
# 01.01.2026 е права за едната половина и мълчаливо грешна за другата — числата изглеждат
# уверени, датите лъжат.
#
# Отпечатъкът (мин, макс, най-често) е тук, защото БРОЯТ РЕДОВЕ не различава двете приложения на
# МОД: и двете имат по 744 суми. Кое е заредено се познава единствено по числата.
#
# ⚠️ ПРОВЕРЯВА СЕ СРЕЩУ БАЗАТА, НЕ СРЕЩУ CSV-ТАТА. App Install е upsert по importId и умее само две
# неща: да вкара нов ред и да обнови стойност. НЕ умее нито едното от тези две:
#   · да ИЗТРИЕ ред — махнат от файла, той остава жив в базата;
#   · да ИЗЧИСТИ стойност — празна клетка не става NULL, старата стойност си остава (например
#     validTo, опразнено във файла, остава в базата).
# И двете са мълчаливи: файлът твърди едно, изчислението намира друго. Затова проверката гледа
# базата — сверка срещу seed-а не би хванала нито едното. И двете искат ръчен SQL.
#
# Проверява се от BgZbdooManifestTest след restore-all и App Install. Утре има ЗБДОО 2027 —
# втори файл до този, не промяна по този.

издание:     ЗБДОО 2026
източник:    ДВ бр. 68 от 28.07.2026 г.
приет:       22.07.2026
в_сила_от:   01.01.2026
изключения:  § 5 и § 6 т. 1 — от 01.08.2026 (§ 9 т. 1)

# ── ПРАЗНИТЕ ПЕРИОДИ СА НАРОЧНИ ────────────────────────────────────────────────────────────────
# Данни за 01.01 – 31.07.2026 не се зареждат навсякъде. Но датите трябва да казват истината —
# където има само августовските стойности, validFrom е 01.08.2026, а януари–юли остава празен и
# изчислението за него се проваля шумно. Забранено е обратното: период с начало 01.01.2026, който
# отговаря уверено с августовски числа.
#
# Изключение е МОД: приложение № 1 е заредено и за януари–юли 2026. Останалите съзнателни
# празнини по-долу стоят.

очаквано:

  МОД_по_длъжности:
    таблица: bglocalization_bg_min_insurance_income
    суми:    bglocalization_bg_min_insurance_income_amount
    периоди:
      - период: "01.08.2026 –"
        приложение: "№ 1А"
        редове: 86
        суми: 744
        мин: 620.20
        макс: 1532.00
        най_често: 620.20
        най_често_брой: 246
      - период: "01.01.2026 – 31.07.2026"
        приложение: "№ 1"
        редове: 86
        суми: 744
        мин: 550.66
        макс: 901.41
        най_често: 550.66
        най_често_брой: 728
        # ⚠️ ЧЕТИРИТЕ АГРЕГАТНИ ЧИСЛА НЕ РАЗЛИЧАВАТ ПЛОСКА ТАБЛИЦА ОТ ПРАЗНА. Затова се брои и
        # колко стойности изобщо се отклоняват от прага, и в колко дейности седят.
        изключения: 16
        дейности_с_изключение: 13
        бележка: >-
          ⚠️ ТАБЛИЦАТА Е ПЛОСКА И ТОВА НЕ Е ДЕФЕКТ НА ИЗВЛИЧАНЕТО. 728 от 744 стойности са точно
          550,66. През януари–юли 2026 страната кара на удължен бюджет и минималният праг е
          практически един за всички. Диференцираният МОД по квалификационни групи се връща чак с
          приложение № 1А от 01.08.2026, което има истинска стълбица — 620,20 · 661 · 716 · 771 ·
          826 · 936. Който погледне таблицата за първата половина на годината, ще реши, че импортът
          е сбъркал; не е.
        изключенията_седят_на: >-
          Шестнайсетте стойности над прага са в тринайсет дейности, всичките в квалификационна
          група 1, а при три дейности — и в група 2: ред 33 (кокс и нефтопродукти) 901,41 и 669,79,
          ред 61 (хотелиерство) 647,30 и 557,31, ред 65 (въздушен транспорт) 614,06 и 563,95.
          Точно тези три реда са и единствените, чиято група 2 се различава от общата 826,00 в
          приложение № 1А — това е и потвърждението, че разпределението по групи е вярно.

  максимален_осигурителен_доход:
    таблица: bglocalization_bg_payroll_parameter
    код: MAX_INSURABLE_INCOME
    периоди:
      - от: 2026-01-01
        до: 2026-07-31
        стойност: 2111.64
      - от: 2026-08-01
        до: null
        стойност: 2300.00

  минимален_за_самоосигуряващи_се:
    таблица: bglocalization_bg_payroll_parameter
    код: MIN_INCOME_SOL
    периоди:
      - от: 2026-01-01
        до: 2026-07-31
        стойност: 550.66
      - от: 2026-08-01
        до: null
        стойност: 620.20

  ТЗПБ:
    таблица: bglocalization_bg_tzpb_rate
    # ⚠️ Заредено е ПЪЛНО ДУБЛИРАНЕ: и двете приложения са с по 87 реда, тоест всеки КИД код има
    # два периода, не само седемте променени. Функционално е вярно — за всяка дата има точно един
    # активен ред — но е различна стратегия от „само променените получават втори период“.
    # Записано като измерена реалност, за да не изглежда като дефект при следващия преглед.
    редове_общо: 174
    кид_кодове: 87
    периоди:
      - от: 2026-01-01
        до: 2026-07-31
        редове: 87
        приложение: "№ 2"
      - от: 2026-08-01
        до: null
        редове: 87
        приложение: "№ 2А"
    сменени_ставки:
      "10": { до: 0.700, от: 0.900 }
      "19": { до: 0.900, от: 1.100 }
      "59": { до: 0.400, от: 0.500 }
      "71": { до: 0.700, от: 0.500 }
      "82": { до: 0.400, от: 0.500 }
      "93": { до: 0.500, от: 0.700 }
      "99": { до: 0.500, от: 0.400 }

  ГВРС:
    таблица: bglocalization_bg_insurance_contribution
    фонд: GVRS
    ставка_работодател: 0.00
    ставка_лице: 0.00
    основание: "чл. 15 ал. 1 ЗБДОО 2026 — за 2026 г. вноски не се внасят"

  кодове_05_и_24:
    таблица: bglocalization_bg_insurance_contribution
    най_ранно_начало: 2026-08-01
    бележка: >-
      § 6 т. 1 (изменението на КСО чл. 6) влиза в сила на 01.08.2026 по § 9 т. 1, тоест
      разпределението 80 : 20 не може да започва по-рано. Изключение е редът за ТЗПБ, който не
      идва от чл. 6 и остава отворен от 01.01.2026.
    изключени_фондове: [TZPB]

  обезщетение_по_чл_106_ал_2_ЗДСл:
    таблица: bglocalization_bg_insurance_contribution
    основание_код: comp_zdsl_106_2
    редове: 6
    периоди:
      - от: 2026-08-01
        до: 2026-12-31
        съотношение: "80/20"
        редове: 3
      - от: 2027-01-01
        до: null
        съотношение: "60/40"
        редове: 3
    затворени_периоди: 3
    фондове: [PENSION, UPF]
    лична_вноска_при_2026_08_01:
      PENSION_WITH_UPF: 3.0000
      PENSION_WITHOUT_UPF: 4.0000
      UPF_WITH_UPF: 1.0000
    бележка: >-
      ⚠️ ПОПРАВЕНО НА 25.08.2026 г. Дотогава тук стояха три ПЛОСКИ реда — 19,80 / 0 и 14,80 / 0 и
      5,00 / 0, тоест вноската изцяло за сметка на платеца, с отворен период. Записът препращаше
      към публикуваната таблица към 01.08.2026 г. и към довода, че обезщетението се плаща СЛЕД
      прекратяването на служебното правоотношение, затова чл. 6 ал. 5а не го стигал.
      Разчитането е сгрешено: КСО чл. 9 ал. 3 т. 5 казва за обезщетението за оставане без работа по
      КТ, ЗДСл и ЗВО единствено, че вноските се внасят върху получаваното обезщетение и СЕ
      РАЗПРЕДЕЛЯТ по чл. 6 ал. 3 т. 8 и 9. Клаузата за сметка на осигурителя или на държавния
      бюджет стои в т. 1-4 на същата алинея — а те са вид осигурен 18, не 27. Тоест разпределението
      не отпада, а следва режима на лицето: за държавния служител това е чл. 6 ал. 5а (нова, ДВ
      бр. 68 от 2026 г., в сила от 01.08.2026 г.), тоест ТРАНШОВЕТЕ НА ВИД ОСИГУРЕН 05 — 80/20 до
      31.12.2026 г. и 60/40 от 01.01.2027 г. По чл. 9 ал. 5 в случаите по т. 5 не се дължи
      Учителски пенсионен фонд, затова наборът остава точно фонд Пенсии и УПФ.
      Три от шестте реда преизползват заварените importId (IC-072, IC-073, IC-082), защото App
      Install е upsert и НЕ трие: нови идентификатори щяха да оставят старите три плоски реда живи
      в базата, тоест шест плюс три реда и DUPLICATE_FUND_ROWS при първото изчисление.
      ⚠️ Другите две обезщетения на код 27 — comp_kt_222_1 и comp_zvo_58_3 — НЕ са пипани: те вече
      бяха разпределени.
