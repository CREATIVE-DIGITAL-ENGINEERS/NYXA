# ── КАКВО ОТ ТОВА ОЩЕ НЕ РАБОТИ ─────────────────────────────────────────────────────────────────
# Записано, а не премълчано: числото, което не може да се получи, е по-безобидно от числото, което
# излиза наглед вярно.
известни_ограничения:

  изборът_по_чл_4в_вече_е_достижим_но_ПОЛУЧАТЕЛЯТ_не_е_моделиран: >-
    ⚠️ ПОПРАВЕНО НА 27.08.2026 г. — БЛОКАДАТА ПАДА, ГРАНИЦАТА СЕ СВИВА ДО ЕДНО ПОЛЕ.
    Комбинации 7, 8, 11, 12, 15, 16, 19 и 20 — осем от двайсетте — минават през чл. 4в ал. 1, който
    сгъва ППФ във фонд „Пенсии“. Дотук BgContributionResolver БЛОКИРАШЕ такава заявка с
    ART4C_NOT_MODELLED, тоест фишът не можеше да се потвърди и лицето не получаваше заплата.

    ДОВОДЪТ БЕШЕ ВЕРЕН ЗА ПЛАЩАНЕТО И ГРЕШЕН ЗА ДЕКЛАРИРАНЕТО. Указание т. 25 от Приложение № 1:
    „размерът на вноската … за професионален пенсионен фонд ИЛИ за лицата по чл. 4в от КСО за фонд
    „Пенсии“ с увеличена осигурителна вноска в размера на вноската за професионален пенсионен фонд“.
    Д6 т. 13 казва същото с „и/или“. Тоест И ДВЕТЕ ДЕКЛАРАЦИИ СЛИВАТ двата случая в ЕДНА точка —
    тази на ППФ, — и редът за ППФ, оставен както е, дава точно нея: т. 22 носи основната пенсионна
    ставка (17,8 при първа категория), т. 25 носи 12,0, а сборът 29,8 е числото от справката на НАП.

    ⚠️ КАКВО ОСТАВА НЕМОДЕЛИРАНО — ПО ИМЕ: ПОЛУЧАТЕЛЯТ. BgContributionFund.bgRecipient за ППФ е
    PENSION_COMPANY, а при избор по чл. 4в парите отиват в НОИ. Това мени банковия превод и
    осчетоводяването, не декларацията. Границата е ЕДНА КОЛОНА, а не цял фиш.

    ⚠️ И ЕДНО, КОЕТО РЕДОВЕТЕ ПО-ДОЛУ КАЗВАТ, А ЛЕСНО СЕ ЧЕТЕ ГРЕШНО: колоната „пенсии“ в
    комбинациите носи 29,8 — това е ПОЛУЧАТЕЛЯТ (парите във фонд „Пенсии“), НЕ точката в
    декларацията. Точките са две: 17,8 в т. 22 и 12,0 в т. 25. Двете твърдения не се изключват.

  изборът_по_чл_4а_ал_2_е_НЕПОДДЪРЖАН: >-
    ⚠️ ПОПРАВЕНО НА 15.08.2026 г. — ПОДРАЗБИРАЩОТО СЕ Е „НЕ“, НЕ „ДА“. Първата версия на тези редове
    носеше безработицата с обхват ANY, тоест резолверът начисляваше 1 на сто на ВСЯКО морско лице.
    Това беше грешно за ВСИЧКИ случаи наведнъж: неизбралият получаваше завишена вноска, а избрал не
    можеше никой, защото дискриминатор няма. Сега трите реда IC-131, IC-137 и IC-144 носят обхват
    ART4A_AL2 и излизат от подразбиращия се набор — без записан избор морското лице получава
    23,3 / 38,3 / 33,3 според категорията.

    ПОСОКАТА Е ИЗБРАНА НАРОЧНО: липсваща функционалност се вижда, завишена вноска не се вижда.
    Неупражнената опция е неупражнена — чл. 4а ал. 2 казва „по свой избор и желание“, тоест без
    изричен избор задължение НЯМА.

    ⚠️ ЧАСТИЧНО ПОДДЪРЖАН ОТ 18.08.2026 г. — И ЗАЕМАНЕТО ОСТАВА. Дискриминатор ВЕЧЕ ИМА:
    EmploymentContract.bgSeafarerUnemploymentChoice е булев избор на договора и
    BgPayrollInputBuilder.solScopeOf го мапва true → ART4A_AL2, иначе ANY. Тоест избралият вече
    получава третия ред, а неизбралият — не, и посоката на подразбирането остава „не“.

    КАКВО ОБАЧЕ ОСТАВА НЕРЕШЕНО: заемането на чужда ос. bgSolScope значи „обхват при
    самоосигуряване“, а морското лице не е самоосигуряващо се — сега същата колона носи ДВА
    несвързани въпроса (ALL_RISKS/PENSION_ONLY за СОЛ и ART4A_AL2 за чл. 4а ал. 2) и нищо в
    схемата не пречи да се появят заедно. Чистото решение е непроменено: собствена колона
    bgArt4aAl2Scope на BgInsuranceContribution плюс отделна ос във филтъра на
    BgInsuranceCalculationService. Кодове 25 и 72 решават същото с ОТДЕЛЕН вид осигурен, което при
    92 е невъзможно: НАП има един код за морските лица.

    ⚠️ И ЕДНА ПРОВЕРКА, КОЯТО НЕ Е В СХЕМАТА, А В ПАЗАЧА: вдигнат избор при вид осигурен, различен
    от 92, е разминаване и се лови от BgInsuredTypeHomeFileTest — сглобителят НЕ го поправя тихо.

  избраният_доход_няма_собствено_поле: >-
    Чл. 4а ал. 1 иска ИЗБРАН доход между двата прага, а BgPayrollInput няма поле за избора. Най-
    близкото е insurableIncomeOverride с insurableIncomeOverrideReason, но то е замислено като
    „човек знае повече от системата“, а тук изборът е законовият механизъм, не изключение.

  редовете_висят_на_празен_шев: >-
    ⚠️ BgPaySlipService#contributions и #minIncome са ПРАЗНИ ШЕВОВЕ (заковани в BgInertSeamTest на
    feature/bg-payslip-guards) — чакат WS-3. Тоест тези двайсет и три реда не достигат до фиш днес
    по никакъв път. Записано изрично, за да не се сметне, че щом редовете ги има, фишът ги ползва.

# ── ТРИ НЕЩА ЗА ЗАПИСВАНЕ, БЕЗ КОДИРАНЕ ─────────────────────────────────────────────────────────
записано_без_кодиране:

  чл_4а_ал_7_удържане: >-
    ЦИТАТ: „Осигурителните вноски на лицата по ал. 1 се удържат и внасят от работодателя до 25-о
    число на месеца, следващ месеца, през който е положен трудът.“ Тоест макар вноските да са
    ИЗЦЯЛО за сметка на лицето, работодателят ги УДЪРЖА и ВНАСЯ. На фиша това са чисти DEBIT редове
    БЕЗ насрещен CREDIT — има удържане от лицето, няма разход за работодателя.

  чл_4а_ал_6_ред_на_изчерпване: >-
    При доходи и от дейности по чл. 4 вноските се дължат върху СБОРА от осигурителните доходи, но
    върху не повече от максималния месечен размер, и то в определен РЕД на изчерпване:
    1. доходи от дейности по чл. 4 ал. 1 и 10 · 2. доходи от обезщетения по КТ или специални закони
    · 3. осигурителният доход като морско лице · 4. ЕТ, собственици и съдружници, свободни професии,
    земеделски стопани · 5. доходи за работа без трудово правоотношение.
    ⚠️ Полето otherEmployerInsurableIncome в BgPayrollInput е ЕДНО ЧИСЛО и не може да изрази ред —
    записано е в javadoc-а му.

  чл_4а_ал_4_без_годишно_изравняване: >-
    Морските лица НЕ определят окончателен размер на осигурителния доход от трудово правоотношение
    като морски лица — за тази част ГОДИШНО ИЗРАВНЯВАНЕ НЯМА. Следствие за WS-3: годишната сверка
    не бива да обхваща тази компонента.

# ── ЗАВАРЕНИЯТ РЕД ПО КОД 92 ────────────────────────────────────────────────────────────────────
поправено_по_код_92:
  bgFloorType: >-
    Беше NONE, стана MIN_INCOME_SOL. Чл. 4а ал. 1 иска доход между МИНИМАЛНИЯ и максималния за
    самоосигуряващите се, а NONE значеше, че BgInsurableIncomeService не налага НИКАКЪВ долен праг:
    морско лице можеше да се осигури под 550,66 (съответно 620,20) евро без никой да се обади.
    Таванът работеше и преди — MAX_INSURABLE_INCOME не зависи от вида осигурен.

  здравна_вноска: >-
    НЯМАШЕ нито един HEALTH ред, сега има три — по един на категория (IC-147-2026, IC-148-2026,
    IC-149-2026), 8 на сто изцяло за сметка на лицето. ⚠️ ОБЪРНАТ ЗАПИС, НЕ ИЗТРИТ: дотук манифестът
    твърдеше „липсата е известна и умишлена, а не пропуск“ с довода, че чл. 4а ал. 1 изброява само
    фондовете на ДОО и не урежда здравното осигуряване. ДОВОДЪТ БЕШЕ ВЕРЕН, ИЗВОДЪТ — ГРЕШЕН: тъкмо
    защото КСО не урежда здравното, то се урежда от ЗЗО, а ЗЗО чл. 40 ал. 1 т. 2а хваща морските
    лица ИЗРИЧНО и им дава 8 на сто за своя сметка. „НЕ Е СВЕРЕН член“ значеше, че член не е ТЪРСЕН
    в ЗЗО — не че такъв няма. Следствието от липсата: морското лице минаваше през целия каталог без
    здравна вноска и ЗОВ просто не се начисляваше на никого.
    Платецът е лицето, а работодателят само УДЪРЖА по чл. 4а ал. 7 КСО — оттам employerRate 0.0000 с
    bgEmployerRateKind = STRUCTURAL_ZERO, по образеца на вид осигурен 12 (IC-079-2026).

  bgNoNetPay: >-
    Беше true, стана false. ⚠️ ОБЪРНАТ ЗАПИС, НЕ ИЗТРИТ: дотук стоеше в „остава открито“ с извод
    „дотогава стойността остава true — заварената — за да не се сменя поведение на сляпо“. ПОВЕДЕНИЕ
    НЯМА КАКВО ДА СЕ СМЕНИ: полето няма НИТО ЕДИН читател в главния код — BgInsuredType.xml го
    обявява, bg-insured-type-views.xml го показва, bg-localization-config.xml го внася, и толкова.
    Тоест смяната е за КОРЕКТНОСТ НА ДАННИТЕ, а не за поведение, и доводът „на сляпо“ не важи.
    По същество: чл. 4а ал. 7 КСО казва, че вноските СЕ УДЪРЖАТ от работодателя — удържа се от
    ВЪЗНАГРАЖДЕНИЕ, значи възнаграждение има и нето след удържането има, тоест Д1 т. 34 е попълнима.
    Същият довод е вече записан дословно в SOL_FLOOR_BORROWED на BgInsuredTypeHomeFileTest: код 92
    ИМА работодател и трудов договор, а прагът на СОЛ му е ЗАЕТ, не признак.
    ⚠️ ОСТАВА ЗА СВЕРКА: точният текст на Указанията за Д1 не е четен и тук. Поиска ли той друго за
    морско лице, връщането става с НОВ запис и нова причина, а не с тихо връщане на true.

# ── ОСТАВА ОТКРИТО ──────────────────────────────────────────────────────────────────────────────
# Всеки въпрос тук носи ТРИ неща: посоката на доказателството, защо НЕ се решава тук, и
# кога може да се реши. Без третото „остава открито“ се чете като „забравено“ и се почва отначало.
открити_въпроси:

  изборът_по_чл_4а_ал_2:
    състояние: НЕПОДДЪРЖАН — подразбирането е „без безработица“ и то е вярно
    посока_на_доказателството: >-
      Чл. 4а ал. 2 КСО: безработицата е „по свой избор и желание“. Тоест неупражненият избор НЕ
      поражда задължение и подразбирането „без“ е законово вярното.
    защо_не_тук: >-
      Поддръжката иска СОБСТВЕНА колона-дискриминатор на BgInsuranceContribution, поле в
      BgPayrollInput и ос във филтъра — три промени в модела, а не в данните. Заемането на
      bgSolScope, което ползваме днес, върши точно едно нещо: изкарва реда от подразбирането.
      За избора то е негодно, защото solScope значи друго.
    кога_се_решава: >-
      Когато се появи морско лице, което ДЕЙСТВИТЕЛНО е избрало по ал. 2. Дотогава редовете стоят
      заредени и верни — липсва само пътят до тях, а липсата се вижда.
