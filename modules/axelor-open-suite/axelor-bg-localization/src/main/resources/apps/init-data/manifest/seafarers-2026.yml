# Манифест на осигурителния режим за МОРСКИТЕ ЛИЦА (вид осигурен 92, КСО чл. 4а).
#
# ЗАЩО СЪЩЕСТВУВА. Видът осигурен 92 „Морски лица“ може да стои в номенклатурата с НУЛА реда със
# ставки — тогава каталогът изглежда пълен, а всяко изчисление за морско лице пада на
# NO_CONTRIBUTIONS_FOUND. Празният вход е ТАРИФНИЯТ, не видът осигурен, и точно това разминаване не
# се вижда от нито един брояч на редове: bg_insured_type казва „има го“, bg_insurance_contribution
# мълчи.
#
# ⚠️ СРЕЩУ БАЗАТА СЕ ПРОВЕРЯВА ДРУГО, НЕ СЪЩОТО. App Install е upsert по importId: не трие ред и не
# изчиства стойност, тоест CSV-то може да казва едно, а базата да пази друго. Двайсет и трите реда
# достигат до заварена база САМО през uninstall → App Install — вдигането на версията на модула
# презарежда ИЗГЛЕДИ и СЕЛЕКЦИИ, а не начални данни.
#
# ⚠️ ПРОВЕРЯВА СЕ ОТ ДВА ТЕСТА, ЗАЩОТО ВЪПРОСИТЕ СА ДВА.
#   BgSeafarerSeedFileTest          — „вярно ли е ЗАПИСАНО“. Чете en/ и fr/ от диска и тече ВИНАГИ.
#   BgSeafarerContributionManifestTest — „ДОСТАВЕНО ли е“. Иска база и се ПРОПУСКА с обявена причина,
#                                     когато каталогът е празен, тоест App Install не е пускан.
# Слети в един тест, отговорът „не е пускан App Install“ маскира отговора „ставката е сгрешена“.

издание:   Морски лица (КСО чл. 4а), 2026 г.
източник:  КСО чл. 4а и чл. 157 — сверени дословно на 15.08.2026 г.
съставен:  2026-08-15

# ── ДВЕТЕ СТРУКТУРНИ РАЗЛИКИ, ПО-ВАЖНИ ОТ САМИТЕ СТАВКИ ──────────────────────────────────────────
# Който запомни само ставките, ще сгреши и двете.
структурни_разлики:

  осигурителен_доход_се_избира: >-
    Чл. 4а ал. 1 КСО: морското лице се осигурява върху ИЗБРАН месечен осигурителен доход между
    минималния и максималния размер за САМООСИГУРЯВАЩИТЕ СЕ ЛИЦА по ЗБДОО. Тоест доходът НЕ се
    извежда от брутното възнаграждение, а се избира в границите MIN_INCOME_SOL и
    MAX_INSURABLE_INCOME (ЗБДОО чл. 9 т. 1 б. „б“ и „в“ — 550,66 и 2111,64 евро до 31.07.2026 г., и
    т. 2 б. „б“ и „в“ — 620,20 и 2300 евро от 01.08.2026 г.).
    МОД ПО НКПД И КВАЛИФИКАЦИОННА ГРУПА НЕ СЕ ПРИЛАГА: осемдесет и шестте реда и 1488-те стойности
    на Приложение №1 не важат за морско лице. В данните това е bgAppliesMod = false на код 92, а
    BgMinInsuranceIncomeService връща notApplicable още преди да погледне НКПД.

  тзпб_е_плоско: >-
    Чл. 4а ал. 3 т. 5 КСО: фонд ТЗПБ е 1,1 на сто — плоско и за ТРИТЕ категории труд. НЕ по КИД, НЕ
    от bg_tzpb_rate и НЕ от диапазона 0,4–1,2. Затова всяка от трите категории носи СОБСТВЕН ТЗПБ
    ред: BgContributionResolver добавя ТЗПБ по ставката от заявката и я пише на РАБОТОДАТЕЛЯ
    единствено когато наборът редове няма собствен ТЗПБ ред.

# ── КОЙ ПЛАЩА ───────────────────────────────────────────────────────────────────────────────────
# Чл. 4а ал. 1 КСО: „изцяло за своя сметка“. Чл. 4а ал. 2: и безработицата е изцяло за своя сметка.
# ЗЗО чл. 40 ал. 1 т. 2а: и здравната вноска на морското лице е изцяло за негова сметка — ДРУГ
# закон, същият платец. Оттам ВСИЧКИТЕ двайсет и три реда носят платец „лице“ и нула за осигурителя
# — нула изключения.
платец:
  всички_редове: лице
  ставка_за_осигурителя: 0.0000
  основание: КСО чл. 4а ал. 1 и ал. 2; ЗЗО чл. 40 ал. 1 т. 2а за здравната вноска

