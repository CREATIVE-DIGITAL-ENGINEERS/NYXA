# Манифест на скаларните параметри за заплати.
#
# ЗАЩО СЪЩЕСТВУВА. Редакция на едно описание може да не влезе (например филтър по importId с
# префикс „PP-“ пропуска ред с importId CLASS-2026), докато App Install минава с нула грешки и нула
# нови реда и промяната изглежда направена. Хваща я проверка в базата, не импортът. Оттам този файл.
#
# ⚠️ ПРОВЕРЯВА СЕ СРЕЩУ БАЗАТА, НЕ СРЕЩУ CSV-ТО. App Install е upsert по importId: не трие ред и не
# изчиства стойност, а ред, който не е бил пипнат, изглежда точно като ред, който е бил пипнат.
#
# ⚠️ КАЖДИЯТ РЕД ТРЯБВА ДА НОСИ ОСНОВАНИЕ. Празно описание значи стойност без произход — а стойност
# без произход в заплати е число, което никой не може да защити пред проверка. Проверката за непразно
# описание е тази, която хваща случая по-горе директно.
#
# Проверява се от BgPayrollParameterManifestTest след restore-all и App Install.

издание:   Скаларни параметри за заплати, 2026 г.
съставен:  2026-08-15

# ── ЧЕТИРИ ПАРАМЕТЪРА С ПО ДВЕ ВЕРСИИ ─────────────────────────────────────────────────────────
# 2026 г. има ДВЕ осигурителни половини: до 31.07 действат пренесените стойности, от 01.08 — новите
# по ЗБДОО 2026 (ДВ бр. 68 от 28.07.2026 г.). Четири параметъра се менят на тази граница, а
# останалите пет важат за цялата година. Ако някой ден един от четирите остане с ЕДИН отворен ред,
# това е дефектът, който този манифест лови: изчисление за юли ще отговори с августовско число.
#
# ⚠️ ДВЕТЕ ПОЛУГОДИЯ НЕ СА НАША КОНСТРУКЦИЯ — ТЕ СА СТРУКТУРАТА НА САМИЯ ЗАКОН. Чл. 9 от ЗБДОО за
# 2026 г. е написан с т. 1 за периода 01.01–31.07 и т. 2 за 01.08–31.12, като буквите под всяка точка
# се повтарят: б. „б“ е минималният осигурителен доход за самоосигуряващите се, б. „в“ — максималният.
# Влизането в сила на втората точка е по § 5 от преходните и заключителните разпоредби.
#
# Тоест моделът „един код, две версии по validFrom“ повтаря БУКВАТА на текста, а не усложнява нещо
# просто. Ако някой ден изглежда като излишна сложност — това е мястото, където пише защо не е.

очаквано:

  редове: 22
  различни_кода: 18

  # Всичките осемнайсет кода, с броя версии и границите им.
  кодове:
    INCOME_TAX_RATE:          {версии: 1, стойности: [10.0000],            единица: PERCENT}
    INCOME_TAX_RATE_SEAFARER: {версии: 1, стойности: [1.0000],             единица: PERCENT}
    DIVIDEND_TAX_RATE:        {версии: 1, стойности: [5.0000],             единица: PERCENT}
    MIN_WAGE:                 {версии: 1, стойности: [620.2000],           единица: EUR}
    DISABILITY_RELIEF_MONTHLY: {версии: 1, стойности: [337.4500],          единица: EUR}
    # ⚠️ ГОДИШНОТО ОБЛЕКЧЕНИЕ ПО ЧЛ. 18 АЛ. 1 — ОТДЕЛЕН КОД ОТ МЕСЕЧНОТО ПО АЛ. 2, А НЕ ВТОРА
    # ВЕРСИЯ ПО validFrom. Двете важат ЕДНОВРЕМЕННО и се различават по механизъм: ал. 2 намалява
    # МЕСЕЧНАТА данъчна основа по чл. 42 ал. 2 (това прави фишът), ал. 1 намалява ГОДИШНАТА по
    # чл. 25 (това прави преизчисляването по чл. 49). Версиите по дата вече значат друго в този
    # каталог — двете полугодия на 2026 г.
    # ⚠️ 7920 лв. / 1,95583 = 4049,4317 → 4049,43. ПРЕВАЛУТИРА СЕ ГОДИШНАТА СУМА ОТ НОРМАТА, а не
    # 12 x месечната: 12 x 337,45 = 4049,40. Трите стотинки разлика са закръглянето на месечното и
    # НЕ са грешка тук — чл. 18 ал. 1 носи свое число, а не дванайсет пъти чуждото.
    DISABILITY_RELIEF_ANNUAL: {версии: 1, стойности: [4049.4300],           единица: EUR}
    SENIORITY_MIN_PCT:        {версии: 1, стойности: [0.6000],             единица: PERCENT}
    MAX_INSURABLE_INCOME:     {версии: 2, стойности: [2111.6400, 2300.0000], единица: EUR}
    MIN_INCOME_SOL:           {версии: 2, стойности: [550.6600, 620.2000], единица: EUR}
    HEALTH_ABSENCE_BASE:      {версии: 2, стойности: [550.6600, 620.2000], единица: EUR}
    HEALTH_UNPAID_LEAVE_BASE: {версии: 2, стойности: [275.3300, 310.1000], единица: EUR}
    # ⚠️ ПОЛОВИНАТА ОТ МРЗ, И ТЯ Е ОТДЕЛЕН ПАРАМЕТЪР, А НЕ ДЕЛЕНИЕ В КОДА. КСО чл. 4а1 ал. 1
    # дословно: лицата, събиращи диворастящи гъби и плодове, се осигуряват „върху месечен
    # осигурителен доход в размер на ПОЛОВИНАТА от минималната работна заплата за страната“. НАП
    # Приложение № 1 (ВК-30-10237/12.08.2026) разд. 18 отпечатва числото: „1/2 МРЗ - 310,10 евро“.
    # ⚠️ СЪВПАДА С ВТОРАТА ВЕРСИЯ НА HEALTH_UNPAID_LEAVE_BASE (310,10) И ТОВА Е СЪВПАДЕНИЕ, НЕ
    # ВРЪЗКА: онова е половината от минималния осигурителен доход за САМООСИГУРЯВАЩИТЕ СЕ по ЗЗО
    # чл. 40 ал. 1 т. 1 б. „б“, а това е половината от МРЗ по КСО чл. 4а1. През първото полугодие
    # двете се разминават (275,33 срещу 310,10) — точно същото разминаване от седем месеца, което
    # разделът „двата_пода“ по-долу описва. Слети в един код, те щяха да съвпаднат по случайност и
    # да се разделят мълчаливо при следващия ЗБДОО.
    # ⚠️ ЕДНА ВЕРСИЯ, ЗАТВОРЕНА НА 31.12.2026: МРЗ се определя годишно с ПМС.
    HALF_MIN_WAGE:            {версии: 1, стойности: [310.1000],           единица: EUR}
    # ⚠️ АЛТЕРНАТИВНИЯТ ДАНЪК ПО ЧЛ. 41а ЗДДФЛ — ЕДИНСТВЕНИЯТ ИЗВЕДЕН, А НЕ ЦИТИРАН ПАРАМЕТЪР ТУК.
    # Нормата казва 30 ЛВ.; 30 / 1,95583 = 15,3388… → 15,34 € до евроцент. На машината НЯМА текст на
    # закона за въвеждане на еврото, а копието на ЗДДФЛ носи чл. 41а само с ДВ бр. 106 от 2023 г.
    # Появи ли се изрична цифра в закон, ТЯ е водеща.
    # ⚠️ И е БЕЗ втора версия/крайна дата, за разлика от HALF_MIN_WAGE: сумата не идва от ЗБДОО и
    # не се преопределя годишно.
    ALT_TAX_ART41A:           {версии: 1, стойности: [15.3400],            единица: EUR}

    # ── ПЕТТЕ СТАВКИ НА ЧАСОВИЯ ЕНДЖИН ──────────────────────────────────────────────────────────
    # ⚠️ ЗАЩО ИЗОБЩО СА ДАННИ. И петте стоят дословно в НСОРЗ и се менят С НАРЕДБАТА — последно с
    # ДВ бр. 115 от 2025 г., в сила от 01.01.2026 г., която пипна И ТРИТЕ ѝ члена наведнъж (чл. 8,
    # чл. 10 и чл. 11). Записани в кода, следващото такова изменение би поискало комит и деплой, а
    # дотогава фишът щеше да плаща по стария размер — тихо, защото и старото число е правдоподобно.
    #
    # ⚠️ И ЗАЩО НОЩНИЯТ ТРУД Е ДВА ПАРАМЕТЪРА, А НЕ ЕДИН. Чл. 8 носи ДВА минимума в едно изречение:
    # „не по-малък от 0,15 на сто от минималната работна заплата … НО НЕ ПО-МАЛКО от 0,51 евро“.
    # Те работят ЗАЕДНО — прилага се по-високият. При МРЗ 620,20 процентът дава 0,9303 и подът НЕ
    # хапе; точно затова подът не бива да се маха „защото не влиза“: годината, в която ще влезе
    # (спадане на МРЗ или вдигане на пода), няма да се обади сама.
    NIGHT_PCT_OF_MIN_WAGE:    {версии: 1, стойности: [0.1500],             единица: PERCENT}
    NIGHT_FLOOR_EUR:          {версии: 1, стойности: [0.5100],             единица: EUR}
    ON_CALL_EUR_PER_HOUR:     {версии: 1, стойности: [0.0500],             единица: EUR}
    # ⚠️ ДВА КОДА ЗА ДВЕТЕ СТЕПЕНИ, а не един с две стойности: чл. 11 ал. 2 дава при повече от едно
    # основание ПО-БЛАГОПРИЯТНИЯ размер, тоест двете суми никога не се събират и не се избират по
    # дата — избират се по СТЕПЕНТА, която е поле на трудовия договор.
    DEGREE_DOCTOR_EUR:        {версии: 1, стойности: [7.6700],             единица: EUR}
    DEGREE_DSC_EUR:           {версии: 1, стойности: [25.5600],            единица: EUR}

  # Границата на двете полугодия — една и съща за четирите двойки.
  двойки:
    първо_полугодие: {от: 2026-01-01, до: 2026-07-31}
    второ_полугодие: {от: 2026-08-01, до: null}
    кодове: [MAX_INSURABLE_INCOME, MIN_INCOME_SOL, HEALTH_ABSENCE_BASE, HEALTH_UNPAID_LEAVE_BASE]

  # Всеки ред носи основание. Броят е равен на общия — нула изключения.
  редове_с_описание: 22

  # ⚠️ ДВА ПОДА, КОИТО СЕ РАЗМИНАВАТ СЕДЕМ МЕСЕЦА, И ТОВА НЕ Е ГРЕШКА.
  # МРЗ е 620,20 от 01.01.2026 (ПМС № 243 от 13.11.2025 г., ДВ бр. 98 от 18.11.2025 г.), докато подът
  # за самоосигуряващите се остава 550,66 — миналогодишната МРЗ — до 31.07.2026. Тоест през първите
  # седем месеца минималната заплата е по-висока от минималния осигурителен доход. Изглежда като
  # разместени данни и не е.
  двата_пода:
    MIN_WAGE_от_01_01: 620.2000
    MIN_INCOME_SOL_до_31_07: 550.6600

  # ⚠️ КОЕТО НЕ Е СВЕРЕНО, СТОИ ЗАПИСАНО КАТО НЕСВЕРЕНО.
  #
  # И четирите числа по чл. 9 имат основание от първичен източник (консолидирания текст на ЗБДОО
  # за 2026 г.); справка от външна ТРЗ програма е само потвърждение, не основание.
  #
  # ⚠️ РАЗДЕЛЪТ Е ПРАЗЕН. Чл. 42 ал. 1 ЗДДФЛ е сверен дословно: „Авансовият данък за доходи от
  # трудови правоотношения се определя от работодателя месечно на базата на месечна данъчна основа.“
  # Тоест основанието на INCOME_TAX_RATE е чл. 42, а НЕ чл. 48 — същото, което твърди перо 700 в
  # речника на фиша. Двата наши записа съвпадат.
  #
  # ПРАЗЕН НЕ ЗНАЧИ ЗАКРИТ. Разделът остава в манифеста нарочно: следващото число без първичен
  # източник се вписва ТУК, а не се цитира наужким.
  несверени_основания: []

  # ── ⚠️ КОЕТО НАРОЧНО ГО НЯМА В ТОЗИ КАТАЛОГ ────────────────────────────────────────────────
  #
  # Годишното преизчисляване по чл. 49 иска ПЕТ суми на облекчения. Заредена е ЕДНА
  # (DISABILITY_RELIEF_ANNUAL), а четирите за деца — НЕ. Причината не е недовършена работа:
  #
  # Указание т. 7 към образеца на справката по чл. 73 ал. 6, ДОСЛОВНО: „когато справката се попълва
  # от работодател по основно трудово правоотношение в колони 15 и 16 се посочва само годишният
  # размер на съответното данъчно облекчение ПО § 3, АЛ. 1 И 2 ОТ ПЗР НА ЗДБРБ за 2025 г.“
  #
  # Тоест размерът на облекчението за деца се определя от ЗАКОНА ЗА ДЪРЖАВНИЯ БЮДЖЕТ за съответната
  # година, а НЕ от стоящите в ЗДДФЛ 200/400/600 лв. (чл. 22в ал. 1) и 2000 лв. (чл. 22г ал. 1).
  # Този закон за 2026 г. НЕ е наличен в тази среда — в консолидирания ЗДДФЛ дори стои ПЗР към
  # „Закона за събирането на приходи и извършването на разходи през 2026 г. ДО ПРИЕМАНЕТО на
  # Закона за държавния бюджет за 2026 г.“ (ДВ бр. 113 от 2025 г.).
  #
  # Заведени по стоящия текст на ЗДДФЛ, четирите суми биха дали правдоподобно и почти сигурно
  # ГРЕШНО облекчение — а грешката е в посока „по-малък данък“, тоест в посоката, за която отговаря
  # работодателят. Затова редовете липсват, кодовете им се назовават в текста с границите на всяка
  # генерирана справка, и се завеждат, когато числото от ЗДБРБ е в ръцете.
  незаредени_нарочно:
    CHILD_RELIEF_ONE:        {член: чл. 22в ал. 1 т. 1, размер_от: § 3 ал. 1 ПЗР ЗДБРБ}
    CHILD_RELIEF_TWO:        {член: чл. 22в ал. 1 т. 2, размер_от: § 3 ал. 1 ПЗР ЗДБРБ}
    CHILD_RELIEF_THREE_PLUS: {член: чл. 22в ал. 1 т. 3, размер_от: § 3 ал. 1 ПЗР ЗДБРБ}
    CHILD_DISABILITY_RELIEF: {член: чл. 22г ал. 1,      размер_от: § 3 ал. 2 ПЗР ЗДБРБ}

  # ── МЕСЕЧНАТА ДАНЪЧНА ВЕРИГА ПО ЗДДФЛ ────────────────────────────────────────────────────────
  # Сверена дословно на 15.08.2026 г. ЗАПИСАНА, НЕ КОДИРАНА — изчислението се строи по нея. Стои тук, защото
  # тук живеят двете ставки и облекчението по чл. 18 ал. 2, тоест три от петте ѝ стъпки.
  месечна_данъчна_основа:
    стъпки:
      - "1. Облагаемият доход по чл. 24, НАЧИСЛЕН за месеца."
      - "2. Минус задължителните осигурителни вноски ЗА СМЕТКА НА ЛИЦЕТО по КСО и ЗЗО. Резултатът е
           „месечната данъчна основа“ по чл. 42 ал. 2."
      - "3. Минус облекчението по чл. 18 ал. 2 — DISABILITY_RELIEF_MONTHLY."
      - "4. Минус облекчението по чл. 19 ал. 2 — ⚠️ НЕ Е МОДЕЛИРАНО, виж по-долу."
      - "5. Чл. 42 ал. 4: основата по ал. 3 по ставка 10 на сто (INCOME_TAX_RATE), а за доходите,
           придобити като морско лице — по 1 на сто (INCOME_TAX_RATE_SEAFARER)."

    # ⚠️ ЧЛ. 42 АЛ. 3 ИЗБРОЯВА ТОЧНО ДВЕ ОБЛЕКЧЕНИЯ — чл. 18 ал. 2 и чл. 19 ал. 2. Детските по
    # чл. 22в и чл. 22г НЕ са сред тях: те са само за ГОДИШНОТО преизчисляване. В месечната верига
    # на модула те не участват. Записано, за да не бъдат добавени по погрешка.
    само_две_месечни_облекчения: [чл. 18 ал. 2, чл. 19 ал. 2]

    # ⚠️ ИЗВЕСТНА ЛИПСА — ЧЛ. 19 АЛ. 2. Няма НИТО перо на фиша, НИТО параметър тук, НИТО поле в
    # BgPayrollInput. Нарочно не се добавя нищо: половин механизъм е по-лош от липсващ, защото
    # изглежда завършен. Записано и на трите места, където ще потрябва.
    #
    # Правилото: лични вноски за допълнително доброволно осигуряване, направени през месеца ЧРЕЗ
    # РАБОТОДАТЕЛЯ, до 10 на сто от основата ПО АЛ. 2 — И отделно лични вноски за доброволно здравно
    # осигуряване и премии по застраховки „Живот“ за сметка на лицето, също до 10 на сто от СЪЩАТА
    # основа. ДВА ОТДЕЛНИ ТАВАНА, и двата върху основата по ал. 2, тоест ПРЕДИ облекченията —
    # затова циклична зависимост НЯМА.
    #
    # ⚠️ СЪЩИТЕ ТРИ ДОБРОВОЛНИ ОСИГУРОВКИ СЕ ТРЕТИРАТ ПО ТРИ РАЗЛИЧНИ НАЧИНА според това ЧИЯ Е
    # ВНОСКАТА. Който добави едното, без да види другите две, ще сгреши другите две:
    #   1. за сметка на РАБОТОДАТЕЛЯ — необлагаеми до 60 лв. (ЗДДФЛ чл. 24 ал. 2 т. 12)
    #   2. за сметка на РАБОТОДАТЕЛЯ — осигурителен доход по НЕВД чл. 2 ал. 1
    #   3. ЛИЧНИ вноски — месечно облекчение до 10 на сто (ЗДДФЛ чл. 19 ал. 2)
    # Групата SOCIAL_EXPENSES в manifest/payslip-line-type.yml е съзнателно празна по същата
    # причина и чака същия правен преглед.
    липсва_чл_19_ал_2:
      перо: няма
      параметър: няма
      поле_в_контракта: няма
