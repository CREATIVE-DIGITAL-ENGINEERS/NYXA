# Манифест на производствения календар — кои дни са неприсъствени и кои от тях са изместени.
#
# ЗАЩО СЪЩЕСТВУВА. Броят работни дни в един срок се смята от тези редове. Липсващ ред не чупи нищо —
# просто дава с един ден повече, тоест обезщетение с един ден повече. Тиха аритметична грешка в
# полза на едната страна е точно това, срещу което се пише манифест.
#
# ⚠️ ПРОВЕРЯВА СЕ СРЕЩУ БАЗАТА, НЕ СРЕЩУ CSV-ТО. App Install е upsert по importId: не трие ред и не
# изчиства стойност. Ред, махнат от файла, остава жив в базата.
#
# ⚠️ ГОДИНА БЕЗ РЕДОВЕ = НЕЗАРЕДЕНА ГОДИНА, не година без празници. Разликата се пази от
# BgWorkingDayService: покритието се чете от EventsPlanningLine.year, а не от името на плана.
#
# Проверява се от BgHolidayManifestTest след restore-all и App Install.

издание:   Официални празници (България)
източник:  КТ чл. 154 — списъкът на празниците и правилото за изместване
съставен:  2026-08-14

# ── ОТКЪДЕ ИДВАТ ДАТИТЕ ───────────────────────────────────────────────────────────────────────
# ⚠️ ТЕКСТЪТ НА КТ ЧЛ. 154 АЛ. 1 НЕ Е СВЕРЕН В ТАЗИ СРЕДА и затова НЕ се цитира. Списъкът с
# фиксираните дати е взет от заредената 2026 г. — тя е записът на самия модул за това кои дни са
# официални празници — и е приложен непроменен за 2027 г. Ако някой ден текстът се сравни ред по ред,
# това е мястото, където разликата ще излезе.
#
# Ал. 2 е цитирана дословно, защото е подадена от първичен източник:
#   „Когато официалните празници, с изключение на Великденските празници, съвпадат със събота
#   и/или неделя, първият или първите два работни дни след тях са неприсъствени.“
#
# ⚠️ ВЕЛИКДЕН СЕ ЗАРЕЖДА, НЕ СЕ СМЯТА. Датите му са подадени сверени. Погрешен компутус е тих провал
# от същия вид, който целият този файл гони.
#
# 1 ноември (Ден на народните будители) НЕ е в списъка: неприсъствен е само за учебните заведения.

конвенция:
  ред_на_ден: >-
    По един ред за всеки НЕПРИСЪСТВЕН ден, на датата, на която реално се почива. Празник, паднал в
    събота или неделя, НЕ се записва на своята дата — записва се само изместеният ден, а описанието
    му носи „(изместен от ДД.ММ)“.
  великденско_изключение: >-
    Великденските дни се записват както са, дори когато са в събота или неделя, и не местят нищо.
    Великден 12.04.2026 е неделя и въпреки това е ред. Велика събота — също: тя Е официален празник.
    ⚠️ ПОПРАВЕНО НА 14.08.2026: в първоначално заредената 2026 г. Велика събота ЛИПСВАШЕ, и от тази
    липса беше изведено правило „Велика събота не е ред“. Правилото беше грешно — то описваше
    пропуск в данните, а не норма. Последната точка на чл. 154 ал. 1 изброява „Велики петък, Велика
    събота и Великден“ заедно. Оттам броят става 14 на година, не 13.
  защо_липсата_оцеля_дълго: >-
    Велика събота винаги пада в събота, тоест никога не влиза в броенето понеделник–петък. Липсата ѝ
    не мени нито едно изчисление и затова не се вижда по числата — вижда се само при сверка ред по
    ред със закона.
  изместване_по_работни_дни: >-
    Изместването отива на първия РАБОТЕН ден след празника, не на първия календарен. Ден, който вече
    е неработен на друго основание, се прескача.

очаквано:

  2026:
    редове: 14
    дати:
      - {дата: 2026-01-01, ден: четвъртък, повод: Нова година}
      - {дата: 2026-03-03, ден: вторник, повод: Ден на Освобождението}
      - {дата: 2026-04-10, ден: петък, повод: Велики петък}
      - {дата: 2026-04-11, ден: събота, повод: Велика събота}
      - {дата: 2026-04-12, ден: неделя, повод: Великден}
      - {дата: 2026-04-13, ден: понеделник, повод: Велики понеделник}
      - {дата: 2026-05-01, ден: петък, повод: Ден на труда}
      - {дата: 2026-05-06, ден: сряда, повод: Гергьовден}
      - {дата: 2026-05-25, ден: понеделник, повод: Ден на българската просвета и култура}
      - {дата: 2026-09-07, ден: понеделник, повод: Ден на Съединението}
      - {дата: 2026-09-22, ден: вторник, повод: Ден на Независимостта}
      - {дата: 2026-12-24, ден: четвъртък, повод: Бъдни вечер}
      - {дата: 2026-12-25, ден: петък, повод: Рождество Христово}
      - {дата: 2026-12-28, ден: понеделник, повод: Втори ден на Коледа}
    изместени:
      - {от: 2026-05-24, на: 2026-05-25, защото: 24 май е неделя}
      - {от: 2026-09-06, на: 2026-09-07, защото: 6 септември е неделя}
      - {от: 2026-12-26, на: 2026-12-28, защото: 26 декември е събота}
    контролни_числа:
      "01.04 – 30.04": 20
      "01.12 – 30.12": 19

  2027:
    редове: 14
    дати:
      - {дата: 2027-01-01, ден: петък, повод: Нова година}
      - {дата: 2027-03-03, ден: сряда, повод: Ден на Освобождението}
      - {дата: 2027-04-30, ден: петък, повод: Разпети петък}
      # ⚠️ 01.05.2027 е ДВА празника в един ден и оттам ДВА реда, които не си противоречат: Велика
      # събота стои на своята дата (великденските не се местят), а Денят на труда се мести на 04.05.
      - {дата: 2027-05-01, ден: събота, повод: Велика събота}
      - {дата: 2027-05-02, ден: неделя, повод: Великден}
      - {дата: 2027-05-03, ден: понеделник, повод: Велики понеделник}
      - {дата: 2027-05-04, ден: вторник, повод: Ден на труда}
      - {дата: 2027-05-06, ден: четвъртък, повод: Гергьовден}
      - {дата: 2027-05-24, ден: понеделник, повод: Ден на българската просвета и култура}
      - {дата: 2027-09-06, ден: понеделник, повод: Ден на Съединението}
      - {дата: 2027-09-22, ден: сряда, повод: Ден на Независимостта}
      - {дата: 2027-12-24, ден: петък, повод: Бъдни вечер}
      - {дата: 2027-12-27, ден: понеделник, повод: Рождество Христово}
      - {дата: 2027-12-28, ден: вторник, повод: Втори ден на Коледа}
    изместени:
      - от: 2027-05-01
        на: 2027-05-04
        защото: >-
          1 май 2027 г. е СЪБОТА и същевременно Велика събота. ⚠️ Като Велика събота не мести нищо —
          изключението по ал. 2. Като Ден на труда обаче СЕ мести, защото изключението важи само за
          великденските празници. Първият РАБОТЕН ден след 1 май не е понеделник 3 май: той е Велики
          понеделник и вече е неработен. Значи ВТОРНИК 4 май. Наивно „следващия понеделник“ би слепило
          двата празника и би загубило един почивен ден.
      - от: 2027-12-25
        на: 2027-12-27
        защото: 25 декември е събота — първият работен ден след уикенда
      - от: 2027-12-26
        на: 2027-12-28
        защото: >-
          26 декември е неделя. Два празника в един уикенд местят ДВЕ почивки — „първите два работни
          дни“ по ал. 2. Непочивният низ е 24–28 декември, пет дни подред.
    контролни_числа:
      "29.04 – 07.05": 3
      "20.12 – 31.12": 7

  # ⚠️ 2028 НЕ Е ЗАРЕДЕНА и това не е пропуск на този клон, а следващата задача. Механизмът вече
  # различава „няма празници“ от „не знам“: потвърждаване на документ, чийто срок навлиза в 2028 г.,
  # се БЛОКИРА, освен ако количеството не е надписано на ръка. Отделно от това
  # BgHolidayCalendarTest#theCalendarReachesSixMonthsAhead ще падне около 1 юли 2027 г.
  най_късна_покрита_година: 2027

# ── ГРАНИЦАТА МЕЖДУ ДВАТА ПЛАНА НЕ НОСИ СМИСЪЛ ────────────────────────────────────────────────
# Редовете са разделени в два EventsPlanning („Официални празници (България) 2026“ и „… 2027“) само
# защото така е започнало. ⚠️ НИЩО НЕ БИВА ДА ЗАВИСИ ОТ ТОВА В КОЙ ПЛАН Е РЕДЪТ: годината живее на
# самия ред (EventsPlanningLine.year) и заявките минават през нея — BgWorkingDayService чете само
# EventsPlanningLine, без нито едно присъединяване към плана.
#
# Оттам следва и че прехвърлянето на всички редове в един план би било козметика, а не поправка, и
# че добавянето на 2028 г. може да мине по който и да е от двата начина. Ако някой ден заявка тръгне
# през плана — това е дефект, а не избор на стил: името на плана е низ, който всеки сменя от формата.
плоска_структура: >-
  Годината е на реда, не на плана. Двата плана са наследство от начина на въвеждане и нямат
  поведение зад себе си.
