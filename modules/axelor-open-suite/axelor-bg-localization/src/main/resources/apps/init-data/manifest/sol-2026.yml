    грешка от драйвера, далеч от причината си. Поправката е една команда:
      ALTER TABLE bglocalization_bg_pay_slip ALTER COLUMN employment_contract DROP NOT NULL;
    или свежа база. Свидетелят е BgSelfInsuredSchemaDbTest#thePaySlipContractColumnIsNullable и се
    пропуска с обявена причина, когато база няма.

