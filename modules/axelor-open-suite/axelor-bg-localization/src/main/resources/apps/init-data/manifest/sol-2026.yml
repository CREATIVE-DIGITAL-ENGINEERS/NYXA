    ✅ ЗАТВОРЕН на 28.08.2026 г.: ЗДРАВНОТО ИМ Е ИЗВЪН ТОЗИ ПОТОК. Лицето не подлежи на осигуряване
    по чл. 40 ал. 1, 2 и 3 ЗЗО, тоест попада в ал. 5 и се здравоосигурява САМО, с декларация обр. 7.
    За код 87 чл. 40а дава и ВЪЗМОЖНОСТ изобщо да не заплаща вноски при над 183 дни в чужбина, след
    заявление до НАП. Тоест здравен ред тук би бил не просто несверен, а възможно противоположен на
    дължимото. Тримата получиха по три реда — Пенсии и УПФ — и НИТО ЕДИН здравен; основанието за
    всеки поотделно е в BgHealthContributionInvariantTest.SELF_PAID_HEALTH_ART40_5.
    ⚠️ И ЕДНО, КОЕТО ЩЕШЕ ДА МИНЕ ТИХО. Наборът {PENSION, UPF} е ТОЧНО изходът на инварианта за
    периодите по КСО чл. 9 ал. 3 — тримата биха минали през него БЕЗ никой да пише нищо, но по
    ЧУЖДА норма. Затова списъкът с основания се пита ПЪРВИ, преди изхода по набор.
    ⚠️ И ОЩЕ ЕДНО, ИЗМЕРЕНО ОТ НАРЕДБАТА: чл. 16 ал. 1 НООСЛБГРЧМЛ казва, че изпращащият посредник
    „ДЕЙСТВА КАТО ОСИГУРИТЕЛ за лицето“. Затова 86, 87 и 91 остават на ДОГОВОРНИЯ път и влизат в
    BgInsuredTypeHomeFileTest.SOL_FLOOR_BORROWED, а не в дома на самоосигуряващите се — прагът им е
    ЗАЕТ, не признак.
    ⚠️ И ЕДНА РАЗЛИКА МЕЖДУ ТРИМАТА, която не се вижда по ставките: базата на 86 е ИЗБРАНА между
    минималния за СОЛ и максималния (разд. 14 и чл. 17 ал. 1: „избран месечен осигурителен доход
    между минималния и максималния“), а на 87 и 91 е ФИКСИРАНА на минималния (чл. 16 ал. 1 и
    чл. 17а ал. 1). Ставките им съвпадат буква по буква, базите — не.
    ИЗХОДНАТА ЗАПИСКА, КОЯТО ГО ДЪРЖЕШЕ ОТВОРЕН: ⚠️ НАП ПРИЛОЖЕНИЕ № 1 НЕ ДАВА ЗДРАВНА СТАВКА ЗА ТЯХ, а за съседните раздели дава. Измерено ред
    по ред: разд. 13 (кодове 87 и 91) и разд. 14 (код 86) изписват В КОЛОНАТА ЗА ОБХВАТ „фонд
    Пенсии и НЗОК“, но в колоните със ставки стои САМО „за ДОО 19,8“ — докато разд. 10, 15 и 18
    изписват „за ЗО-8“ изрично там, където здравна вноска се дължи.
    И ЗЗО не я дава: чл. 40 ал. 1 изброява осем точки и НИТО ЕДНА не покрива лицата, изпратени на
    работа в чужбина от български посредник, нито съпрузите на дългосрочно командированите.
    ⚠️ А чл. 40а сочи в ОБРАТНАТА посока: българските граждани, които пребивават в чужбина повече от
    183 дни през календарната година, МОГАТ ДА НЕ ЗАПЛАЩАТ здравноосигурителни вноски след подадено
    заявление до НАП. Тоест за лице, изпратено на работа в чужбина, „здравно 8 на сто“ е не просто
    несверено — то може да е точно обратното на дължимото.
    (Дотук стоеше: „ЧАКА потвърждение кой е платецът и по кой член.“ Отговорът дойде и е горе.)

  по_кой_ред_се_здравноосигурява_съпругът_по_чл_4_ал_9_ЗАТВОРЕН: >-
    ✅ ЗАТВОРЕН на 28.08.2026 г.: ПО ЧЛ. 40 АЛ. 5 ЗЗО, САМ, С ДЕКЛАРАЦИЯ ОБР. 7 — точно прочитът,
    записан долу, потвърден от счетоводител. Изключението влезе в инварианта С ОСНОВАНИЕ, а не по
    име: чл. 40 ал. 1 не изброява лицата по чл. 4 ал. 9 в нито една от осемте си точки, а разд. 15
    не споменава НЗОК дори в обхвата. Точно каквото самият инвариант поиска.
    ИЗХОДНАТА ЗАПИСКА:
    ⚠️ КОД 96 БЕШЕ ПОСТРОЕН И ВЪРНАТ. Всичко за него е сверено: НАП разд. 15 дава ФИКСИРАНА база
    (минималният за самоосигуряващите се) и ставки 23,30 за родените преди 1960 г., съответно
    18,30 + 5 за УПФ; чл. 4 ал. 9 КСО го описва дословно, включително „по свое желание и за своя
    сметка“ и че вноските се дължат „ВЪРХУ минималния осигурителен доход за самоосигуряващите се“.
    СПЪВА СЕ НА ЕДНО: разд. 15 дава обхват само „Фондове на ДОО — Пенсии и ОЗМ“, БЕЗ НЗОК, а ЗЗО
    чл. 40 ал. 1 не изброява лицата по чл. 4 ал. 9 в нито една от осемте си точки.
    ПРОЧИТЪТ, КОЙТО ОБЯСНЯВА И ДВЕТЕ: съпругът попада в чл. 40 ал. 5 ЗЗО („лицата, които не подлежат
    на осигуряване по ал. 1, 2 и 3“) и се здравноосигурява САМ, с декларация обр. 7 — тоест здравната
    му вноска изобщо не минава през този поток.
    ⚠️ НО ТОВА Е ПРОЧИТ, НЕ ЦИТАТ. А инвариантът BgHealthContributionInvariantTest казва в собствения
    си текст „НЕ добавяй изключение — поправи основанието“, и е прав: изключение по догадка отваря
    вратата за всеки следващ код без здравен ред. Тестът падна ТОЧНО на код 96 при опита.
    (Дотук стоеше: „ЧАКА едно изречение дали съпругът се здравноосигурява по чл. 40 ал. 5 ЗЗО.“)

  прагът_на_код_41_иска_нов_параметър_а_той_иска_App_Install_ЗАТВОРЕН: >-
    ✅ ЗАТВОРЕН. Параметрите са 16 (HALF_MIN_WAGE и ALT_TAX_ART41A), тоест базовата половина на
    BgPayrollParameterManifestTest минава едва след App Install — състояние на базата, не дефект
    на кода. App Install е стъпка на оператора.
    ИЗХОДНАТА ЗАПИСКА:
    ⚠️ КОД 41 БЕШЕ ПОСТРОЕН И ВЪРНАТ, И ТОВА Е ЕДИНСТВЕНИЯТ ОТ ЧЕТИРИТЕ, ЧИЙТО БЛОКЕР Е ПРОЦЕСЕН, А
    НЕ НОРМАТИВЕН. Всичко е сверено: чл. 4а1 ал. 1 дословно дава база „в размер на ПОЛОВИНАТА от
    минималната работна заплата“, НАП разд. 18 отпечатва числото („1/2 МРЗ - 310,10 евро“) и
    ставките (19,8 / 14,8 + 5 за УПФ, плюс за ЗО-8), а четирите реда и параметърът HALF_MIN_WAGE
    бяха написани и минаха всички ФАЙЛОВИ проверки.
    Нов ред в bg_payroll_parameter вдига манифеста от 14 на 15 реда, а BgPayrollParameterManifestTest
    сравнява манифеста и с базата, тоест базовата му половина минава едва след App Install.

  алтернативният_данък_по_чл_41а_ЗДДФЛ_ЗАТВОРЕН: >-
    ✅ ЗАТВОРЕН на 28.08.2026 г. — 15,34 €, ИЗВЕДЕНО по курса 1,95583 и потвърдено от счетоводител,
    записано като параметър ALT_TAX_ART41A и обявено като ИЗВЕДЕНО, не като цитат. Д6 вид плащане 7
    и Д1 т. 31а вече се пълнят; подробностите са при код 41 горе.
    ИЗХОДНАТА ЗАПИСКА:
    ⚠️ НОРМАТА Е В ЛЕВОВЕ, А ЦЕЛИЯТ КАТАЛОГ Е В ЕВРО. ЗДДФЛ чл. 41а ал. 1 дословно: доходите от
    събиране на диворастящи гъби и плодове „се облагат еднократно с алтернативен данък в размер на
    30 ЛВ. за всеки месец, през който се извършва дейността“. Ал. 2: данъкът се удържа от
    държавните предприятия по чл. 163 ал. 1 ЗГ преди издаването на позволително.
    30 лв. / 1,95583 = 15,3388… €, тоест НЕ е кръгло число, а дали редеминацията го превръща в
    кръгло е въпрос на закон, не на аритметика. В извлечения текст на ЗДДФЛ сумата още е в левове.
    (Дотук стоеше: „СЛЕДСТВИЕ: Д6 вид плащане 7 и т. 31а на Д1 за код 41 НЕ се пълнят
    автоматично. ЧАКА: числото в евро.“ И двете са направени.)

  годишно_изравняване: >-
    ⚠️ ЛИПСВА ИЗЦЯЛО, И ТО Е ОТДЕЛНА ЛИПСА ОТ ГОРНИТЕ. Чл. 6 ал. 9 КСО: самоосигуряващите се
    определят ОКОНЧАТЕЛЕН размер на осигурителния доход за годината върху облагаемия доход по
    справката към годишната данъчна декларация, в границите между минималния и максималния за СОЛ.
    Тоест месечните вноски са АВАНС, а истинската сума се знае чак след ГДД — механизъм, за който
    в модула няма нито entity, нито служба, нито поле.
    ⚠️ РАЗЛИКАТА С МОРСКИТЕ ЛИЦА Е ТОЧНО ОБРАТНАТА И Е ЗАПИСАНА В seafarers-2026.yml: чл. 4а ал. 4
    казва, че за дохода като морско лице годишно изравняване НЯМА. Двата случая си приличат по
    прага (и двата стъпват на MIN_INCOME_SOL) и се различават по това — грешка, която се прави
    веднъж и се плаща веднъж годишно.

