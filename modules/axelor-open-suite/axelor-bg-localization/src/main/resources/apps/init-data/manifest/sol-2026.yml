# ── КАКВО ТОЧНО ЛИПСВА, ЗА ДА СТАНЕ ПОДДЪРЖАН ───────────────────────────────────────────────────
# Написано като СТЪПКИ, а не като пожелание: разделът съществува, за да може някой да го изпълни.
липсва:

  собствен_сглобител: >-
    ✅ ДОСТАВЕН на 28.08.2026 г. — BgPayrollInputBuilder#buildSelfInsured(BgSelfInsuredRegistration,
    Period). ПУБЛИЧНА ВРАТА, не разширен шев: четирите заварени входа с EmploymentContract остават
    непокътнати. Изходът е същият BgPayrollInput и оттам същият BgContributionRequest — резолверът
    НЕ е дублиран, точно както този раздел го поиска. Разклоняването е в
    BgPaySlipService#payrollInput и е по НОСИТЕЛЯ (регистрация срещу договор), а не по вида
    осигурен: кодът може да се озове и на договор, тоест изведен от него, изборът на сглобител щеше
    да зависи от данни, които сами по себе си може да са сгрешени.

  entity_за_регистрацията: >-
    ✅ ДОСТАВЕНО на 28.08.2026 г. — BgSelfInsuredRegistration плюс колекцията
    BgSelfInsuredActivityPeriod. Носи вида осигурен, основанието по КСО, кода на задълженото лице за
    т. 4 на Д1, ОБХВАТА (ALL_RISKS / PENSION_ONLY, вече със свои записи), ГОДИНАТА на обхвата,
    избрания доход по чл. 6 ал. 8 и признака за пенсионер по чл. 4 ал. 6. Периодите са КОЛЕКЦИЯ, а
    не две дати: т. 15 на Д1 иска последен ден „ПРИ ВСЯКО прекъсване или прекратяване“, а
    формулярът носи ПЕТ двойки.
    ⚠️ Двете полета на Employee ОСТАВАТ, но вече не като източник: bgIsSelfInsured получи първия си
    читател в BgSelfInsuredRules#employeeFlagMismatch (сверка, не поправка), а bgSolInsurableIncome
    е ЗАМЕНЕНО от bgSelectedIncome на регистрацията — изборът е ГОДИШЕН (чл. 6 ал. 8: „за
    съответната година“), а поле на лицето не може да се смени за една година, без да пренапише
    историята.
    ⚠️ СРОКЪТ за подаване на декларацията за вида осигуряване (НООСЛБГРЧМЛ) НЕ Е СВЕРЕН срещу ДВ:
    наредбата не е налична локално. Пази се само ГОДИНАТА, не срокът — правило върху несверен член е
    втора грешка.

  ръчна_стъпка_по_схемата: >-
    ⚠️ ЕДНО ДЕЙСТВИЕ, КОЕТО ddl=update НЕ ПРАВИ САМ. BgPaySlip.employmentContract престана да е
    required, за да може фиш да съществува без договор. Hibernate ДОБАВЯ ограничения, но не СВАЛЯ
