# Манифест на САМООСИГУРЯВАЩИТЕ СЕ ЛИЦА (СОЛ) — разделът, който знае какво още липсва.
#
# ЗАЩО СЪЩЕСТВУВА. Видът осигурен има дом: EmploymentContract.bgInsuredTypeCode.
# Домът е на ТРУДОВИЯ ДОГОВОР, а четири от 43-те кода на номенклатурата описват лица БЕЗ трудов
# договор — самоосигуряващите се. За тях домът е грешен и пазачът BgInsuredTypeHomeFileTest ги
# ОТКАЗВА. Отказ без адрес обаче учи следващия читател само ЧЕ кодът е изключен; този файл е
# адресът, който казва ЗАЩО и КАКВО липсва, за да не е.
#
# ⚠️ ФАЙЛЪТ НЕ ОПИСВА САМО ПРАЗНОТА. Две от петте липси са затворени (собственият сглобител и
# entity-то на регистрацията), а трите останали са ОТБЕЛЯЗАНИ КАТО ТАКИВА.
# Разделът „липсва“ носи и двете състояния нарочно: махнати, затворените липси биха оставили
# читателя без следа КАК е закрито онова, което файлът е поискал.
#
# ⚠️ ФАЙЛЪТ ОПИСВА И ДОСТАВЕНИ ДАННИ, както seafarers-2026.yml: двайсет и четири реда със ставки —
# седем за код 13, четири за 41 и тринайсет за 96, 86, 87 и 91 — и прага на пет кода. Тоест
# твърденията тук имат КАКВО да сверят и се сверяват от BgRateKindSeedTest,
# BgInsuredTypeWave2SeedFileTest и BgInsuredTypeHomeFileTest.
# Слабата проверка ОСТАВА и тя: че този файл съществува и назовава всеки код, който пазачът изключва
# (BgInsuredTypeHomeFileTest#theSolManifestSectionExists).

