  полето_не_е_забранено_в_домейна: >-
    Селекцията bg.insured.type.select ПОКАЗВА всичките пет кода. Изкушението беше да се скрият: тогава
    операторът не може да ги избере и „грешката е невъзможна“. Отхвърлено — скритата опция прави
    причината невидима, а заварените записи в базата пак могат да носят кода. Пазачът, който казва
    „това е СОЛ пътят, ето къде е записан“, учи; липсващият ред в списък не учи нищо.

  ставките_на_код_22: >-
    ⚠️ НЕ ЗАЩОТО НЕ СА СВЕРЕНИ, А ЗАЩОТО ПОТОКЪТ Е ДРУГ. Наредба Н-13 чл. 6 дава на код 22
    ЕДНОКРАТНА декларация обр. 1 за цялата година, а указание т. 9 на Д6 — „число 13 и предходната
    календарна година“ за месец. Редове със ставки без тази каденца биха произвели дванайсет месечни
    декларации там, където наредбата иска една — и всяка от тях щеше да изглежда вярна.
    Клонът за каденцата е отделен и е СЪЩИЯТ като на годишното изравняване.

  any_остава_единственият_изход_на_solScopeOf_за_СОЛ: >-
    ⚠️
    BgPayrollInputBuilder.solScopeOf днес връща само ANY или ART4A_AL2. ALL_RISKS и PENSION_ONLY
    НЕ се подават от никого и това е ВЯРНО за днешния дом: те са обхватът на самоосигуряващото се
    лице, а самоосигуряващият се няма трудов договор, тоест няма как да минат през сглобител, който
    тръгва от договор. Ще ги подаде вторият сглобител, описан по-горе, а не този.
