org.gradle.parallel=true
# A full Open Suite build (~30 modules: code-gen + parallel compileJava in one daemon + the yarn
# front build) exhausts a 2g heap and OOMs mid-compile (corrupting javac's message file and the
# file watcher). 4g daemon heap + 1g metaspace clears it; HeapDumpOnOutOfMemoryError leaves evidence
# if it ever recurs. Lower parallelism instead of this only on a RAM-constrained machine.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
