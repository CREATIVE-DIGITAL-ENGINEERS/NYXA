# AI-OCR ZIP-archive extraction — loose safety guards (10 GB per file / total). Only the
# zip-bomb ratio + entry count remain as cheap backstops. Overridable via env, e.g.
# AXELOR_CONFIG_AIOCR_ZIP_MAX_TOTAL_BYTES.
aiocr.zip.max-depth = 20
aiocr.zip.max-entries = 100000
aiocr.zip.max-entry-bytes = 10737418240
aiocr.zip.max-total-bytes = 10737418240
aiocr.zip.max-ratio = 100000
# Accepted document types for ingestion (informational; the allow-list is enforced in code).
aiocr.import.supported-extensions = pdf,png,jpg,jpeg,tif,tiff
# Azure per-request limits — set to match your Azure tier (free F0 = 2 pages / ~4 MB per request).
# A PDF that exceeds EITHER limit is OCR'd in sequential PDFBox page chunks and stitched back into
# one logical result (chunking is an internal transport detail — it never creates extra records).
# A single physical page still over max-request-mb (after lossless PDFBox normalization) falls back
# to adaptive LOSSY TRANSPORT compression (see aiocr.azure.lossy.* below) — a transient JPEG page
# submitted to Azure only; the lossless page stays the stored/attached source of record.
aiocr.azure.max-request-pages = 2
aiocr.azure.max-request-mb = 4
# Absolute page ceiling for the whole document: beyond this, chunking would mean too many Azure
# calls, so the document is failed outright (0 disables the check).
aiocr.extractor.max-pages = 2000
# Hard byte ceiling on any uploaded PDF PDFBox will parse — a first-line resource-exhaustion guard
# for untrusted uploads. A PDF above this is rejected BEFORE any heavy parse (normalization/OCR).
# Concurrency of PDF parsing/normalization/splitting is separately bounded by the extract pool and
# the aiocr.optimize/split pool-size semaphores. Default 150 MB.
aiocr.pdf.max-bytes = 157286400

# Background processing (Quartz stays OFF — this is an app-managed bounded pool + a DB-backed
# dispatcher). Bounded so nothing runs unbounded; leftover queued docs stay in the DB and drain.
aiocr.extract.pool-size = 2
aiocr.process.pool-size = 4
aiocr.process.queue-capacity = 100
aiocr.process.dispatch-interval-ms = 5000
aiocr.process.stale-timeout-seconds = 900

# DESTRUCTIVE, DEV-ONLY. When true AND the BG settlement dataset has not been imported yet, the
# startup import first DELETES ALL City and Address rows (FK-safe) before importing bgplaces.csv.
# Leave false in production — future startups then only add missing dataset rows, never delete data.
aiocr.city.reset.on.import = false

# Azure retry: 429, timeouts, temporary 5xx, and the ONE retryable 4xx — a 403 whose body says the
# call-volume quota is exhausted, which Azure clears by itself. Every other 403/401 (permissions,
# key auth disabled, network rule) and every other permanent 4xx fails on the first attempt.
# Exponential backoff + jitter, and any Retry-After Azure sends is honoured but capped at 30s so a
# multi-hour replenishment hint cannot park an OCR worker thread.
aiocr.azure.max-retries = 5

# Shared Azure request pacing, scoped PER AZURE RESOURCE and per request kind. The OCR worker pool
# runs several documents at once while F0 accepts only 1 transaction/second, so without this gate
# the pipeline is its own heaviest competitor: most requests collide, return 429, and are paid for
# twice (the wasted round trip plus the backoff). Set these to match your Azure tier — F0 = 1/s for
# both; on S0 (15 TPS default) raise them or set rate.enabled=false.
# NOTE: this paces ONLY the Azure HTTP calls. Local PDF normalization, slicing and compression keep
# running on all worker threads, so local parallelism is unchanged.
aiocr.azure.rate.enabled = true
aiocr.azure.rate.analyze-per-second = 1
aiocr.azure.rate.poll-per-second = 1
# Safety cap on how long one request may wait for a slot, so a pathological pile-up can never park
# a worker. Exceeding it FAILS the request with a clear reason (the document can be retried) — it
# never releases the request unpaced, which would defeat the limiter exactly when it matters most.
# 0 means no ceiling.
aiocr.azure.rate.max-wait-ms = 120000

# A quota 403 whose announced replenishment delay (from the message or Retry-After) is at or above
# this many seconds is a CONFIRMED exhausted allowance, not temporary rate limiting: it is failed
# immediately with a clear reason instead of burning the whole retry/backoff budget first. A quota
# 403 that announces no delay at all is treated as exhausted for the same reason. Below this, it is
# retried as before.
aiocr.azure.quota.exhausted-threshold-seconds = 300

# Storage reserve — keep this many bytes free; extraction/optimization stop before crossing it.
aiocr.storage.min-free-bytes = 2147483648

# Pre-OCR PDF normalization (Apache PDFBox only — NO Ghostscript/qpdf/Python). Strictly LOSSLESS:
# object-stream/Flate re-compression of the PDF structure; text, vectors, fonts, embedded images,
# colour, page size and page count are all preserved (no downsampling, no JPEG re-encoding, no
# rasterization). The normalized PDF replaces the persisted originalFile in place. An image-heavy
# PDF that cannot be shrunk losslessly is left as-is (and may then be chunked for OCR).
aiocr.optimize.enabled = true
aiocr.optimize.pool-size = 2

# Adaptive LOSSY transport compression (Apache PDFBox only — NO Ghostscript/qpdf/Python). Used ONLY
# when a SINGLE PDF page still exceeds aiocr.azure.max-request-mb after lossless normalization: the
# page is rendered and re-encoded as a JPEG-backed one-page PDF that is submitted to Azure and then
# DELETED. It is never stored or attached — originalFile/attachments/dedup keep the lossless page.
# Minimal degradation: target ~95% of the cap, start at 300 DPI + high quality, binary-search the
# highest JPEG quality whose ACTUAL encoded size fits, and only then step the DPI down the ladder.
# If the minimum DPI/quality still cannot fit, the page fails with a clear error (no unreadable OCR).
aiocr.azure.lossy.enabled = true
aiocr.azure.lossy.target-fraction = 0.95
aiocr.azure.lossy.dpi-ladder = 300,250,220,200,180
aiocr.azure.lossy.max-quality = 0.95
aiocr.azure.lossy.min-quality = 0.45
aiocr.azure.lossy.pool-size = 2

# Draft-move line account: for a non-invoice document routed to a Move, ONE debit move line for the
# document NET total is booked to THIS account (by code) for the accountant to reclassify — the
# extracted item rows are kept only as descriptive detail, never as ledger lines. Resolved for the
# move's company ONLY (no global fallback). Leave empty to skip the move line (never booked to a
# guessed account); a warning is added to the move description instead.
aiocr.move.line.account.code =

# ---------------------------------------------------------------------------
# AI Accountant (axelor-ai-accountant) — global assistant backed by the Azure
# Foundry agent "ai-accountant". Off by default; no secrets belong in this file.
# ---------------------------------------------------------------------------

# Master switch. When false the REST status endpoint reports unavailable and the
# floating chat button never renders.
aiaccountant.enabled = true

# Dedicated agent Responses endpoint, copied from the Foundry portal. This is the
# ONLY route used for chat. api-version=v1 is appended automatically (the service
# rejects the request without it). Prefer the AZURE_FOUNDRY_AGENT_ENDPOINT env var.
aiaccountant.azure.agent.endpoint = https://<foundry-resource>.services.ai.azure.com/api/projects/<project>/agents/ai-accountant/endpoint/protocols/openai/responses

# Foundry project endpoint. Used only to read/publish the agent's tool declarations,
# never for chat. Optional: without it, startup simply skips the tool-sync check.
aiaccountant.azure.project.endpoint = https://<foundry-resource>.services.ai.azure.com/api/projects/<project>

aiaccountant.azure.agent = ai-accountant

# Token source behind AiTokenProvider: "client-secret" (default) or "azure-cli".
# "azure-cli" is DEVELOPMENT ONLY — it shells out to `az account get-access-token`
# and borrows the developer's login, so no service principal is needed locally.
# Production will use whatever identity the deployed app is granted; that arrives
# as one more AiTokenProvider implementation.
aiaccountant.azure.auth = client-secret

# Entra client credentials. NEVER commit real values — set them via
# AZURE_FOUNDRY_TENANT_ID / _CLIENT_ID / _CLIENT_SECRET in the deployment environment.
aiaccountant.azure.tenant =
aiaccountant.azure.clientid =
aiaccountant.azure.secret =

# Guardrails.
aiaccountant.max.tool.iterations = 5
aiaccountant.tool.max.result.bytes = 32768
aiaccountant.max.message.chars = 8000
aiaccountant.azure.connect.timeout.seconds = 15
aiaccountant.azure.request.timeout.seconds = 120
aiaccountant.azure.max.retries = 3

# --- AI Accountant: deadlines and retries (Phase 6B) -------------------------
# Every number below is read through AiResiliencePolicy, which is the ONLY place
# that decides how long something may take or how often it may be tried again.
#
# The bound that matters to the person waiting. Per-request timeouts bound one
# call; this bounds the whole turn, retries and backoff included. Nothing is
# interrupted mid-flight — work is simply not STARTED past the deadline, and the
# turn answers with what it has plus what the records actually say. 0 = no bound.
aiaccountant.turn.deadline.seconds = 180

# Entra token requests get their own, much shorter deadline. With the 120s chat
# timeout an unresponsive identity provider could spend the whole turn budget
# before the first model request was even attempted.
aiaccountant.azure.token.timeout.seconds = 20

# Extra attempts for a READ tool after a TRANSIENT failure (refused connection,
# database saying "not now"). Clamped to 0..2. Timeouts are not retried: a query
# that ran long enough to time out will run long enough again.
aiaccountant.tool.read.retry.attempts = 1

# Extra attempts for a WRITE tool — and ONLY after Java has re-read the record and
# proven the write did not land. Clamped to 0..1. There is deliberately no setting
# that makes a write retry on an unknown outcome: when the record's fingerprint has
# moved, or cannot be read at all, the call is reported as an uncertain outcome, the
# record is closed to further writes for the rest of the turn, the workflow stays
# unresolved and the user is told to check it. Set to 0 to turn even the proven case
# into an ordinary reported failure.
aiaccountant.tool.write.retry.attempts = 1

# --- AI Accountant: context budget and chain resets (Phase 6C) ---------------
# Three numbers, one policy (AiContextBudget). All are checked BETWEEN turns only,
# never inside a tool loop — cutting a chain with function calls outstanding would
# strand the response id and fail the next turn with HTTP 400.
#
# The COST bound. Every request re-reads the whole retained conversation behind
# previous_response_id, and measured chains reached 73k input tokens on the FIRST
# request of a turn (~3.1 requests deep). Past this the next turn starts a fresh
# chain with a small deterministic continuity handoff — rebuilt from the STORED
# workflow, not from the model's earlier prose. The UI transcript is untouched and
# "следващата" / "направи същото" keep working. 0 disables this bound only.
aiaccountant.chain.max.input.tokens = 40000

# The HARD bound: the deployed model's context window. Not a preference — past it
# the provider refuses the request and the user loses the turn. Nothing knew this
# number before 6C, so a long conversation had no protection beyond the cost
# heuristic above, which a deployment could legitimately raise. Set it to match the
# actual deployment; under-stating it costs an early reset, over-stating it costs a
# refused request. Confirmed: this deployment's agent runs on gpt-5-mini, whose real
# context window is 400,000 tokens.
aiaccountant.context.window.tokens = 400000

# How much of that window is held back for everything that is NOT retained history:
# this turn's instruction documents, its tool results, and the model's own answer
# including reasoning tokens. Only the chain is measured against the bound, so the
# rest has to be reserved in advance rather than discovered when a request fails.
# Raise it if tool results are large (maxToolResultBytes is 32 KB per call and a
# turn can make several).
aiaccountant.context.reserve.tokens = 32000

# Persistent metrics. The ai.turn / ai.budget lines also go to this file, in addition to the
# stdout line (which is unchanged). Container stdout is discarded when the container is replaced,
# so without this every rebuild destroys the measured history. /logs is a host mount, so the
# sample survives rebuilds and can be read directly. Only the metrics logger is attached, so no ordinary application log is duplicated and
# no document, supplier, IBAN or tool argument can reach the file. Empty = stdout only.
aiaccountant.metrics.file = /logs/ai-metrics.log
aiaccountant.metrics.max.file.size = 5MB
aiaccountant.metrics.max.files = 5

# Tools allowed to write with NO human present (the OCR intake pipeline). Only for
# changes the server decides entirely on its own — a deterministic lookup with exactly
# one answer, validated in Java. Model judgement must never reach this list.
# Comma-separated; empty means nothing writes unattended. No wildcard, deliberately.
# apply_exact_product_code stays named here but is no longer declared to the model
# (AiTool.published() = false): no flow ever asked for it, because intake already
# resolves an exact Product.code by itself and the background repair pass applies its
# own suggestions in Java. Keeping the name means re-enabling it is a one-line change
# and this list does not silently become empty; it grants nothing while unpublished.
aiaccountant.write.unattended.tools = apply_exact_product_code

# Tools usable from the chat, where a person is present and reading the answers. A call
# here EXECUTES when the model makes it and the server allows it — there is no approval
# queue and no confirmation word. The server decides whether the turn may write at all and to
# which records: it resolves and freezes the authorised target set from what the user said and
# what is on screen (never from tool arguments), then checks this allowlist, the active-company
# scope, row permissions, document state and the typed arguments each tool validates. The
# operating procedure only governs what the model asks for within that.
# The previous design parked every write and required the user's next message to match a
# list of affirmative words. It rejected ordinary approvals ("hell yeah", "давай"), could
# not tell an approval that CHANGED the data from a plain yes, and turned one correction
# into two turns and a numbered menu of pending changes. It has been removed entirely.
# manage_supplier writes Partner master data (a new supplier, an address, a bank account),
# which is why it is chat-only and absent from the unattended list above: a supplier
# invented by an automatic pass would outlive the document that produced it.
# edit_supplier_invoice carries the supplier, the header fields and every line operation in
# ONE atomic call, so a whole correction is one transaction that either lands or does not.
# fix_partner_account turns on reconcileOk / useForPartnerBalance for ONE partner account of the
# active company. Axelor refuses to validate or ventilate an invoice whose partner account lacks
# either flag (InvoiceToolService.checkUseForPartnerBalanceAndReconcileOk), and the shipped BG
# chart of accounts marks 401 Доставчици useForPartnerBalance=false — so every company created
# from that template hits this. The service refuses any account that is not this company's, is not
# payable/receivable, or is not actually used as a partner account, and only ever turns flags on.
# validate_supplier_invoice runs Axelor's own Validate on an OCR draft (InvoiceService.validate,
# the same call the button makes). It is refused unless the record is usable, every readiness
# blocker is gone and the amounts do not MISMATCH, and it refuses rather than clicks through the
# two questions Axelor would have asked a person (duplicate supplier invoice number, empty VAT
# summary). It does NOT ventilate: nothing is posted and the invoice can be set back to draft.
# NOTHING IN THIS LIST WRITES TO THE BOOKS. The three posting tools — ventilate_supplier_invoice,
# ventilate_customer_invoice and post_move — are not enabled:
# posting (ventilating an invoice, accounting a move) is a person's act on the form, not the
# assistant's. The tools still exist and are still declared, but the dispatcher refuses every call
# with write_not_allowed ("not enabled for use from the chat") because they are not named here.
# The assistant prepares, repairs and validates; a person presses Ventilate / Accounting.
# Do NOT add them back without a decision on record. AiToolDispatcherShippedConfigTest pins this.
# ventilate_supplier_invoice (NOT enabled) would post a VALIDATED invoice through
# InvoiceService.ventilate — the Ventilate button: the invoice number from the company sequence and
# the accounting Move.
# create_move writes a manual accounting move (journal entry) in NEW status — a draft, exactly as
# if it had been entered on the Move form and saved. It posts nothing. The journal and every
# account are resolved by exact code in the active company and an unknown code is refused rather
# than approximated, so the assistant cannot post to a nearly-right account. Debits and credits
# must total the same: the check runs before the transaction writes anything, so a rejected entry
# leaves no draft behind for someone to find and delete. It saves through MoveRepository, not
# around it, which is where the journal's authorised-role check lives — so it can only create what
# the same user could have created through the form.
# edit_move corrects a move that is still a NEW draft — header fields and every line operation in
# ONE atomic call, so a whole correction is one transaction that either lands or does not. It is
# refused for every other status, and refused with the reason that fits it: an ACCOUNTED move is in
# the books and is corrected by a reversing entry, a DAYBOOK move goes through Axelor's own daybook
# path, a CANCELED one needs a new entry, a SIMULATED one has frozen line fields. It deliberately
# does NOT require the result to balance — Axelor lets a draft be saved out of balance and refuses
# only at posting — but it always reports whether it does. Like create_move it saves through
# MoveRepository, so the journal's authorised-role check still applies.
# post_move (NOT enabled) would post a move through MoveValidateService.accounting — the
# Accounting button. With it absent the assistant drafts journal entries but never posts them.
# ventilate_customer_invoice (NOT enabled) would post a customer invoice through
# InvoiceService.ventilate, the same as ventilate_supplier_invoice above.
# run_bank_statement_import runs a bank statement's import: BankStatementImportService.runImport,
# the same call the Import button makes. It creates the statement's lines and sets it to IMPORTED,
# and it posts nothing — statement lines become accounting only through bank reconciliation, which
# is a different screen and has no tool. It is the only write the bank statement domain offers:
# lines are read-only in Axelor, creating a statement means attaching a file (which the assistant
# cannot do), and deleting one is left to a person. It requires bankDetailsId because BankStatement
# has NO company column — the account is what ties the import to a company — and it refuses if that
# account is not this company's or if the imported lines land on a different one. Remove it from
# this list to leave the assistant read-only over bank statements.
#   available: manage_supplier, edit_supplier_invoice, fix_partner_account,
#              validate_supplier_invoice, refresh_supplier_invoice_terms,
#              create_move, edit_move, run_bank_statement_import,
#              create_customer_invoice, edit_customer_invoice, validate_customer_invoice,
#              refresh_customer_invoice_terms, create_supplier_invoice
#   deliberately absent (posting): ventilate_supplier_invoice, ventilate_customer_invoice,
#              post_move
aiaccountant.write.chat.tools = manage_supplier,edit_supplier_invoice,fix_partner_account,validate_supplier_invoice,refresh_supplier_invoice_terms,create_move,edit_move,run_bank_statement_import,create_customer_invoice,edit_customer_invoice,validate_customer_invoice,refresh_customer_invoice_terms,create_supplier_invoice

# Publishing tool declarations to the Foundry agent creates a new agent version —
# an outward-facing change to a CTO-owned resource, so it is opt-in. Startup only
# ever compares and warns; it never writes.
aiaccountant.azure.allow.agent.publish = false

# --- AI Accountant: transport ------------------------------------------------
# "azure" (default) or "mock". Mock answers offline with deterministic canned
# responses (mirroring aiocr.extractor.mode), so the chat, tool loop and OCR
# correction can be exercised with no credentials and no network.
aiaccountant.azure.mode = azure

# --- AI Accountant: Router Agent (Phase 3, shadow) ---------------------------
# A second, tool-free, stateless agent that classifies a turn — domain, task,
# goal, scope, explicitness — instead of the pattern-matching AiRouteAdapter.
#
# In shadow mode it is called BESIDE the adapter, on a background thread, and
# its answer is only logged: it authorises no write, selects no target and
# changes no behaviour. That is what makes it safe to switch on in production —
# the turn cannot tell whether it ran, and a router that is slow, unreachable or
# answering nonsense costs a log line, not a turn.
#
# Off by default. Enabling it sends every chat message to a second Azure agent,
# so it is deliberately not implied by aiaccountant.enabled.
aiaccountant.router.enabled = false

# "shadow" or "active". Any other value — including a blank and a typo — is read
# as shadow: an unrecognised mode must never be read as permission to route.
#
# active: the router is called synchronously and a valid ROUTE controls the turn.
# A CLARIFICATION is shown to the user word for word and ends the turn without a
# model call. Anything else — invalid, failed, timed out, unparseable, a value
# outside the vocabulary — falls back to AiRouteAdapter, which is still computed
# on every turn for exactly that purpose.
#
# Active mode changes which route the server's checks are applied to. It does not
# change that they are applied: company scope, the caller check, target
# resolution and the full write authorisation all run afterwards, unchanged. The
# one field the router cannot raise is explicitness — capped at what the server
# read from the user's own words — so the router can never manufacture the
# authorisation for a write.
aiaccountant.router.mode = shadow

# The router's own agent endpoint (same shape as the chat one, different agent).
# Empty means unconfigured, which disables the router however the flag is set.
aiaccountant.router.azure.agent.endpoint =

# Short on purpose: a routing answer is worth nothing after the turn is routed.
aiaccountant.router.azure.connect.timeout.seconds = 10
aiaccountant.router.azure.request.timeout.seconds = 15

# Token envelope for ONE router request: the contract, the context, the user's message, the
# stored history AND the router's own answer (including reasoning). Sizes are ESTIMATES
# (AiTokenEstimate, deliberately pessimistic), not exact counts. Old history is dropped whole,
# oldest first, to fit; if the request still cannot fit — the newest exchange or the message
# alone is too large — the router is skipped for that turn (log: "router skipped") and the
# deterministic route is used, with the user's instruction untouched.
aiaccountant.router.request.token.budget = 100000
# Held back from the envelope above for the router's answer and reasoning tokens.
aiaccountant.router.output.reserve.tokens = 8000

# --- AI Accountant: OCR correction (Phase B) --------------------------------
# Post-OCR reconciliation. Runs inside routeInvoice AFTER every deterministic
# step, and only when the extraction has problem fields (missing, suspicious,
# inconsistent, or the supplier did not resolve). A clean invoice never reaches
# the model. Off by default: with this false, intake behaves exactly as before.
# TEMPORARILY DISABLED: the AI Accountant routing/context architecture is being
# reworked, and its "AI Accountant: ..." OCR-intake notes are confusing/noisy in
# the meantime. Re-enable (set back to true) once that rework lands.
aiaccountant.ocr.enabled = false

# Minimum model confidence before a suggestion is even considered. It is a
# necessary condition, never a sufficient one — every value is still re-checked
# in Java (EIK shape, IBAN mod-97, ISO date, currency code, amount sign).
aiaccountant.ocr.min.confidence = 0.90

# --- AI Accountant: post-draft line repair (Phase C) ------------------------
# A SECOND pass, after the draft invoice exists, driven by the readiness report. It can
# give a line a product (and thus an expense account) — the commonest reason an invoice
# that reads "complete" still cannot be ventilated. It never touches amounts, and never
# guesses a tax: an unmapped VAT rate is usually a real special regime (reverse charge,
# ВОП, import, exempt), so those are reported for a person to decide.
# Off by default; with this false, intake output is byte-identical to before.
# TEMPORARILY DISABLED alongside aiaccountant.ocr.enabled above — see that comment.
aiaccountant.ocr.repair.enabled = false

# Minimum model confidence for a line repair. Necessary, never sufficient — the product
# must also exist, not be archived, and actually yield a purchase account for the
# invoice's company.
aiaccountant.ocr.repair.min.confidence = 0.90

# Overall cap on the correction request. Only rawText is trimmed if exceeded,
# and from the middle: headers carry the supplier identity and footers carry the
# payment details, so both ends must survive.
aiaccountant.ocr.max.request.bytes = 131072

# Modules whose declared data-init CSV/XML inputs are re-synced on every startup (upsert by
# importId — never deletes a row whose key is no longer in the input). Comma-separated module names,
# e.g. "axelor-bg-localization,axelor-ai-ocr". Empty/absent = disabled everywhere (default).
#
# Which inputs each module re-imports is declared in ModuleResourceSyncRegistry (axelor-base). Both
# this and the view re-import below are driven by ONE startup coordinator, ModuleResourceSyncService,
# which runs once per application boot — never on a menu click, a form onLoad or an HTTP request.
datainit.sync.modules = axelor-bg-localization

# Optional per-module override of the declared inputs, replacing the built-in list for that module.
# Comma-separated "importer-config.xml > data-directory" pairs, both relative to the module's
# resources. Lets an environment (or a module that ships no registry entry) declare its inputs
# purely in configuration. Absent = use the built-in declarations.
# datainit.sync.axelor-bg-localization.configs = apps/init-data/bg-localization-config.xml > apps/init-data/en, data-init/input-config.xml > data-init/input

# Re-import a module's view XML (views, menus, selections, actions, translations) at startup when
# the deployed build's module version differs from the version recorded in META_MODULE. Without
# this, view XML changes never reach an already-installed database on a plain redeploy + restart —
# Axelor records the module version but never compares it, and only `gradlew database --update`
# forced a refresh. Default: true.
#
# The re-import is authoritative: shipped XML replaces the META_VIEW/META_MENU/META_SELECT/
# META_ACTION rows, so anything edited directly on those rows (Views admin screen, hand-SQL) is
# reverted, and for a dashboard whose XML changed every user's saved customization of it is dropped.
# It does NOT touch reference/seed data (see datainit.sync.modules and App Install for that).
view.sync.on-version-change = true

# ------------------------------------------------------------------ Идент. № по ДДС (VIES)
# Жива проверка на ЧУЖД идент. № по ДДС на партньор в регистъра VIES на Европейската комисия при
# запис. Публично REST API, без ключ и без регистрация. Българският номер НЕ минава оттук — той се
# проверява по контролна цифра на ЕИК на място, тоест записът на български партньор не зависи от
# мрежата и не се бави.
#
# Проверката само ПРЕДУПРЕЖДАВА и никога не спира записа. Недостъпна услуга, изтекло време и
# грешка в мрежата дават „не можах да проверя“, а не „невалиден“.
#
# УБИВАЩ КЛЮЧ: false изключва мрежата изцяло (остава само офлайн проверката) и при това МЪЛЧИ,
# вместо да съобщава за недостъпност. Сложи го на false, ако изходът към ec.europa.eu е затворен
# на средата — не е нужен нов билд. Default: true.
bg.vat.vies.enabled = true

# Основата на услугата. Изнесена, за да може да се насочи другаде (или към стъб) без прекомпилиране.
bg.vat.vies.baseUrl = https://ec.europa.eu/taxation_customs/vies/rest-api

# Таван в милисекунди — важи И за свързването, И за отговора, тоест записът на партньор не може да
# увисне за повече от толкова. Обичайният отговор е 0,15–0,68 s. Default: 4000.
bg.vat.vies.timeoutMs = 4000

