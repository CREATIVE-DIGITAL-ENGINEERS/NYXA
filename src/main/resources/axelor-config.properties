# Currency pairs kept up to date from the ECB (App Base > Currency Ws URL), as FROM/TO, comma
# separated. At startup a pair without a current line is added at today's ECB rate, and all
# current lines are refreshed if any is older than the previous working day; after that the
# bg-exchange-rates-daily schedule updates them every working day at 18:00. Default: every
# currency the ECB publishes (29 since BGN left on 1 January 2026). To stop following a pair,
# remove it here (or the next startup adds it back) AND set a "To date" on its current line (or
# the daily schedule keeps updating it).
nyxa.exchange-rates.pairs = EUR/USD, EUR/JPY, EUR/CZK, EUR/DKK, EUR/GBP, EUR/HUF, EUR/PLN, \
  EUR/RON, EUR/SEK, EUR/CHF, EUR/ISK, EUR/NOK, EUR/TRY, EUR/AUD, EUR/BRL, EUR/CAD, EUR/CNY, \
