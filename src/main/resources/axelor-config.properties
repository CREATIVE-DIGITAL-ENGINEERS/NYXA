# Auth
# ~~~~~

# Keycloak OIDC Settings (Keycloak federates to Entra ID on its side)
#
# NOTE: auth.provider.* is read by the Axelor Enterprise edition only. In this build the keys below
# are read by com.weaccount.KeycloakClientListService, which wires the pac4j OIDC client by hand and
# registers it as the ONLY browser login path. Startup fails if client-id or discovery-uri is blank
# — there is no local login fallback by design.
auth.provider.oidc.client.id = localhost
auth.provider.oidc.secret = 
auth.provider.oidc.discovery.uri = https://<idp-host>/realms/<realm>/.well-known/openid-configuration
auth.provider.oidc.callback.url = http://localhost:8080/callback
auth.provider.oidc.scope = openid profile email

# Back-channel timeouts (ms) for the app's calls to Keycloak during login (token exchange, JWKS).
# pac4j's own defaults (500 / 5000) are too tight behind Azure Front Door and fail logins with
# "connect timed out". Read by com.weaccount.KeycloakClientListService.
auth.provider.oidc.connect.timeout = 5000
auth.provider.oidc.read.timeout = 10000

# Name of the ID token claim expected to equal auth.provider.oidc.client.id (as must azp). A mismatch
# rejects the login.
# See com.weaccount.WeAccountAuthorizationGenerator.
auth.provider.oidc.client.id.claim = clientId

# Name of the ID token claim holding the user's role names.
auth.provider.oidc.roles.claim = roles

# Keycloak roles are used as Axelor role names as they are: the per-area roles (accounting.write,
# hr.payroll.read, all.read, client.admin, ...) are the role names of the nyxa-security catalogue
#. Optional comma-separated "KeycloakRole:AxelorRole" pairs rename them if ever needed,
# several targets separated by "|", e.g.:
#auth.provider.oidc.role.mapping = some.role:accounting.read|invoicing.read
#
# Do NOT map client.admin to Axelor's stock "Admin" role. client.admin must arrive as client.admin:
# every client.admin gate checks that name (Application Config › Users and Roles, period closing,
# accounting configuration). Stock "Admin" carries Open Suite's perm.<module>.all permissions with
# no company condition, which bypasses the per-area roles and the active-company scoping.
# client.admin reaches users and roles through Application Config › Users/Companies; Axelor's
# technical Administration is for nyxa.admin (the admins group).

# Keycloak role that makes a user a TECHNICAL admin: the admins group, which bypasses every
# permission and code check. Nyxa staff only; client.admin is a business role in the staff group.
# Re-evaluated on every login: losing the role in Keycloak demotes the user to staff.
auth.provider.oidc.admin.role = nyxa.admin

# Axelor Group code assigned when the admin role is present.
auth.provider.oidc.admin.group = admins

# Axelor Group code assigned otherwise. Must exist (seeded via data-init/input/auth.xml).
auth.provider.oidc.staff.group = staff

# Tenant user management (nyxa-security, Users screen). Invitations, role changes and revocations go
# to the realm's client-users endpoint (weAccount.Keycloak), authenticated as the client above with
# its service account: no extra settings. Deliberately NOT set to mock here, since this file also
# ships to deployed environments; for local development without Keycloak, set the env var
# AXELOR_CONFIG_NYXA_USERS_DIRECTORY=mock (in-memory, grants nothing in Keycloak).
#nyxa.users.directory = keycloak
#nyxa.users.directory.timeout = 10

# comma-separated list of provider names
#auth.provider-order =

# Default callback URL (for indirect clients)
#auth.callback-url =

# user provisioning: create / link / none
auth.user.provisioning = create

# default group for created users
#auth.user.default-group = users

# attribute used as the value for the principal name.
#auth.user.principal-attribute = email

# Where the browser lands after logout. Deliberately a page outside the protected app: landing on
# the app would redirect to Keycloak, which — having no session of its own left — would hand off to
# Entra, whose session is still valid, and sign the user straight back in. Served from /public/**,
# which is anonymous in the Shiro filter chain.
#
# This value is sent to Keycloak as post_logout_redirect_uri, so it must be listed in the client's
# "Valid post logout redirect URIs" or the logout is rejected.
#
# Read by com.weaccount.WeAccountLogoutLogic and set per deployment with
# AXELOR_CONFIG_AUTH_LOGOUT_REDIRECT_URL. It replaces the platform key auth.logout.default-url, which
# has a hyphen and so can't be set from the environment: don't set that one.
auth.logout.redirect.url = http://localhost:8080/public/logged-out.html

# logout URL pattern
#auth.logout.url-pattern =

# remove profiles from session
#auth.logout.local = true

# Call the identity provider's end_session_endpoint on logout, so that signing out of the app also
# ends the Keycloak SSO session. Read by com.weaccount.WeAccountLogoutLogic; the platform itself
# honours this key in the Enterprise edition only.
auth.logout.central = true

# enable indirect and/or direct basic auth
#
# Both are disabled (the platform default when the key is unset): Keycloak OIDC is the only login
# provider. indirect would be an HTTP Basic browser login and direct an HTTP Basic credential on
# every REST request, both checked against the local user table and so bypassing Keycloak.
#auth.local.basic-auth = indirect, direct


